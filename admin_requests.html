<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إدارة طلبات التعديل - المدير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { 
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; 
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0; padding: 20px; min-height: 100vh;
    }
    .top-header {
      max-width: 1400px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #b3463a 0%, #1c3f66 100%);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(15, 40, 70, 0.4);
    }
    .top-header .brand { display: flex; align-items: center; gap: 10px; }
    .top-header .brand img { height: 34px; width: auto; filter: drop-shadow(0 2px 6px rgba(15, 40, 70, 0.25)); }
    .top-header .brand span { color: white; font-weight: 800; font-size: 14px; }
    .top-header .nav-actions { display: flex; gap: 10px; }
    .top-header .nav-actions a, .top-header .nav-actions button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background 0.2s ease;
    }
    .top-header .nav-actions a:hover, .top-header .nav-actions button:hover {
      background: rgba(255,255,255,0.28);
    }
    .container { max-width: 1400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18); position: relative; overflow: hidden; }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #b3463a 0%, #1c3f66 50%, #b3463a 100%);
    }
    h2 { text-align: center; color: #b3463a; font-weight: 800; margin-top: 0; }
    .filters { margin: 20px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .export-btn {
      padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
      font-weight: bold; font-size: 13px; font-family: 'Tajawal', sans-serif; color: white;
    }
    .export-excel-btn { background: #217346; }
    .export-pdf-btn { background: #c0392b; }
    .export-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    select, .search-input { padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    .search-input { min-width: 220px; font-family: 'Tajawal', sans-serif; }
    .approved-cell { background-color: #e6ffe6; color: #008000; font-weight: bold; }
    .rejected-cell { background-color: #ffe6e6; color: #cc0000; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 12px; text-align: right; font-size: 14px; }
    th { background-color: #f2f2f2; }
    .action-btn { 
      padding: 6px 12px; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer;
      margin: 2px;
      font-weight: bold;
    }
    .view-btn { background: #3498db; color: white; }
    .status-Pending { background: #f39c12; color: white; }
    .status-Approved { background: #2ecc71; color: white; }
    .status-Rejected { background: #e74c3c; color: white; }
    .loading { text-align: center; padding: 40px; color: #777; }
    .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .modal-content { background: white; margin: 3% auto; padding: 25px 25px 0 25px; width: 90%; max-width: 900px; border-radius: 8px; max-height: 92vh; overflow-y: auto; }
    .comparison-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 15px; }
    .old-data, .new-data { padding: 15px; border-radius: 6px; }
    .old-data { background: #fbecec; border: 1px solid #e74c3c; }
    .new-data { background: #e8f8f5; border: 1px solid #2ecc71; }
    .comparison-grid h4 { margin-top: 0; }
    .notes-section { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 6px; }
    .footer-actions { 
      text-align: center; 
      position: sticky;
      bottom: 0;
      background: white;
      margin: 20px -25px 0 -25px;
      padding: 15px 25px 22px;
      border-top: 2px solid #eee;
      box-shadow: 0 -6px 14px rgba(0,0,0,0.08);
    }
    .footer-actions button { margin: 0 10px; padding: 10px 20px; font-size: 16px; }
    .approve-btn { background: #2ecc71; color: white; }
    .reject-btn { background: #e74c3c; color: white; }
    #requestsContainer {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      border-radius: 8px;
    }
    #requestsContainer table {
      min-width: 700px;
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .container { padding: 15px; }
      .top-header { flex-direction: column; align-items: stretch; gap: 10px; padding: 12px 16px; }
      .top-header .brand { justify-content: center; }
      .top-header .nav-actions { justify-content: center; }
      .modal-content { width: 95% !important; padding-left: 15px !important; padding-right: 15px !important; }
      .comparison-grid { grid-template-columns: 1fr !important; }
      table th, table td { padding: 6px 8px !important; font-size: 12px !important; }
    }
    @media (max-width: 520px) {
      h2 { font-size: 20px !important; }
    }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand">
      <img src="logo.png" alt="Caritas Egypt" />
      <span>نظام إدارة التمويل</span>
    </div>
    <div class="nav-actions">
      <a href="index.html">🏠 الرئيسية</a>
      <button onclick="pageLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="container">
    <h2>مراجعة طلبات التعديل المعلقة</h2>
    <div id="notifBanner"></div>

    <div class="filters">
      <select id="statusFilter" onchange="applyFilter()">
        <option value="Pending">الطلبات المعلقة فقط</option>
        <option value="">جميع الطلبات</option>
        <option value="Approved">الطلبات المقبولة</option>
        <option value="Rejected">الطلبات المرفوضة</option>
      </select>
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث بالاسم أو كود العميل..." oninput="applyFilter()">
      <button class="export-btn export-excel-btn" onclick="exportToExcel()">📊 تصدير Excel (تفصيلي)</button>
      <button class="export-btn export-pdf-btn" onclick="exportToPDF()">🖨️ تصدير PDF</button>
    </div>

    <div id="requestsContainer">
      <div class="loading">جارٍ تحميل طلبات التعديل...</div>
    </div>
  </div>

  <div id="comparisonModal" class="modal">
    <div class="modal-content">
      <h3>مقارنة طلب التعديل (<span id="modal-request-id"></span>)</h3>
      <p>
        <strong>مقدم الطلب:</strong> <span id="modal-requester-name"></span> (<span id="modal-requester-id"></span>) | 
        <strong>دور مقدم الطلب:</strong> <span id="modal-requester-role"></span> |
        <strong>تاريخ الطلب:</strong> <span id="modal-request-date"></span>
      </p>

      <div class="notes-section">
        <h4>ملاحظات مقدم الطلب:</h4>
        <p id="modal-notes"></p>
      </div>

      <div class="comparison-grid">
        <div class="old-data">
          <h4>البيانات الأصلية الحالية في النظام (قبل التعديل)</h4>
          <div id="old-values"></div>
        </div>
        <div class="new-data">
          <h4>البيانات المطلوبة للتعديل</h4>
          <div id="new-values"></div>
        </div>
      </div>
      
      <div id="modal-status-display" style="text-align:center; margin-top:20px; font-weight:bold; font-size:1.2em;"></div>

      <div class="footer-actions">
        <button id="approveButton" class="action-btn approve-btn" onclick="approveRequest(currentRequestId)">قبول الطلب وتطبيق التعديلات</button>
        <button id="rejectButton" class="action-btn reject-btn" onclick="rejectRequest(currentRequestId)">رفض الطلب</button>
        <button class="action-btn" onclick="closeModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    function pageLogout() {
      if (confirm("هل تريد تسجيل الخروج من النظام؟")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    // ✅ الروابط المصححة بدون مسافات أو أحرف تالفة
    const SUPABASE_URL = 'https://akjyrmmqsnxdbkslxmvb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFranlybW1xc254ZGJrc2x4bXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODUxODcsImV4cCI6MjA4MDQ2MTE4N30.EuTd_i9fEecFGJG89PhRa3z68k5x6nflOW6fvqvMQJM';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allRequests = [];
    let loggedInUser = {};
    let currentRequestId = null;

    async function init() {
      const userId = localStorage.getItem('loggedInUserId');
      if (!userId) {
        alert("الرجاء تسجيل الدخول أولًا!");
        window.location.href = "index.html";
        return;
      }

      const { data: user, error: userError } = await db
        .from('users')
        .select('role, full_name, id')
        .eq('id', userId)
        .single();

      if (userError || !user) {
        alert("حدث خطأ في تحميل بيانات المستخدم.");
        window.location.href = "index.html";
        return;
      }

      loggedInUser = user;

      // ✅ التحقق من أن المستخدم مدير
      if (loggedInUser.role !== 'admin') {
        alert("ليس لديك صلاحية الوصول إلى هذه الصفحة.");
        window.location.href = "index.html";
        return;
      }
      
      await loadRequests();
    }

    async function loadRequests() {
      document.getElementById('requestsContainer').innerHTML = '<div class="loading">جارٍ تحميل طلبات التعديل...</div>';

      const { data, error } = await db
        .from('edit_requests')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('requestsContainer').innerHTML = `<div class="status-Rejected">خطأ: ${error.message}</div>`;
        return;
      }

      allRequests = data;
      await attachOperationDetails(allRequests);
      renderNotifBanner();
      applyFilter();
    }

    // ✅ بيجيب اسم/كود العميل + الأربع حالات موافقة (المراجعة الداخلية / مسؤول المتابعة /
    //    موافقة مسئول المشروع / الادارة) من operations_with_details لكل الطلبات دفعة واحدة
    async function attachOperationDetails(requests) {
      const operationIds = Array.from(new Set(requests.map(r => r.operation_id).filter(id => id !== null && id !== undefined)));
      if (operationIds.length === 0) return;

      const { data, error } = await db
        .from('operations_with_details')
        .select('id, "كود_العميل", "اسم_العميل", "اسم_العميل_من_التقييم", "المراجعة الداخلية", "مسؤول المتابعة", "موافقة مسئول المشروع", "الادارة"')
        .in('id', operationIds);

      if (error) {
        console.error('تعذر جلب بيانات العملية المرتبطة بالطلبات:', error.message);
        return;
      }

      const detailsMap = {};
      (data || []).forEach(row => { detailsMap[row.id] = row; });

      requests.forEach(r => {
        const details = detailsMap[r.operation_id] || {};
        r.client_code = details["كود_العميل"] || '';
        r.client_name = details["اسم_العميل"] || details["اسم_العميل_من_التقييم"] || '';
        r.review_status = details["المراجعة الداخلية"] || '';
        r.followup_status = details["مسؤول المتابعة"] || '';
        r.project_officer_status = details["موافقة مسئول المشروع"] || '';
        r.admin_status = details["الادارة"] || '';
      });
    }

    function renderNotifBanner() {
      const pending = allRequests.filter(r => r.status === 'Pending').length;
      const banner = document.getElementById('notifBanner');
      if (pending > 0) {
        banner.innerHTML = `<div style="background:#fff3cd; border:1px solid #ffeaa7; color:#856404; padding:12px 16px; border-radius:8px; margin-bottom:15px; font-weight:700; text-align:center;">
          🔔 يوجد <span style="font-size:16px;">${pending}</span> طلب تعديل لسه تحت المراجعة
        </div>`;
      } else {
        banner.innerHTML = `<div style="background:#e8f6f3; border:1px solid #a3e4d7; color:#1d8348; padding:10px 16px; border-radius:8px; margin-bottom:15px; font-weight:700; text-align:center;">
          ✅ مفيش طلبات تعديل معلقة حاليًا
        </div>`;
      }
    }

    function applyFilter() {
      renderTable(getCurrentlyFilteredRequests());
    }

    function getApprovalCellClass(value) {
      if (!value) return '';
      const v = value.toLowerCase();
      if (v.includes('مقبول')) return 'approved-cell';
      if (v.includes('مرفوض') || v.includes('ملغي')) return 'rejected-cell';
      return '';
    }

    function renderTable(data) {
      if (!data || data.length === 0) {
        document.getElementById('requestsContainer').innerHTML = '<div class="loading">لا توجد طلبات تعديل.</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>رقم الطلب</th>
              <th>رقم العملية</th>
              <th>كود العميل</th>
              <th>اسم العميل</th>
              <th>مقدم الطلب</th>
              <th>دور مقدم الطلب</th>
              <th>تاريخ الطلب</th>
              <th>المراجعة الداخلية</th>
              <th>مسؤول المتابعة</th>
              <th>موافقة مسئول المشروع</th>
              <th>الادارة</th>
              <th>الحالة</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(row => {
        const statusText = 
          row.status === 'Pending' ? 'معلق' :
          row.status === 'Approved' ? 'مقبول' : 'مرفوض';
        
        html += `
          <tr>
            <td>${row.id}</td>
            <td>${row.operation_id}</td>
            <td>${row.client_code || '—'}</td>
            <td>${row.client_name || '—'}</td>
            <td>${row.requested_by}</td>
            <td>${row.requester_role || 'غير محدد'}</td>
            <td>${new Date(row.created_at).toLocaleDateString('ar-EG')}</td>
            <td class="${getApprovalCellClass(row.review_status)}">${row.review_status || '—'}</td>
            <td class="${getApprovalCellClass(row.followup_status)}">${row.followup_status || '—'}</td>
            <td class="${getApprovalCellClass(row.project_officer_status)}">${row.project_officer_status || '—'}</td>
            <td class="${getApprovalCellClass(row.admin_status)}">${row.admin_status || '—'}</td>
            <td><span class="action-btn status-${row.status}">${statusText}</span></td>
            <td>
              <button class="action-btn view-btn" onclick="openComparisonModal(${row.id})">مقارنة</button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      document.getElementById('requestsContainer').innerHTML = html;
    }
    
    function openComparisonModal(requestId) {
      const request = allRequests.find(r => r.id === requestId);
      if (!request) return;

      currentRequestId = requestId;

      document.getElementById('modal-request-id').textContent = request.id;
      document.getElementById('modal-requester-name').textContent = request.requested_by;
      document.getElementById('modal-requester-id').textContent = request.requester_id;
      document.getElementById('modal-requester-role').textContent = request.requester_role || 'غير محدد';
      document.getElementById('modal-request-date').textContent = new Date(request.created_at).toLocaleString('ar-EG');
      document.getElementById('modal-notes').textContent = request.notes || 'لا توجد ملاحظات';
      
      renderComparisonData(request.old_value, 'old-values');
      renderComparisonData(request.new_value, 'new-values');

      const statusDisplay = document.getElementById('modal-status-display');
      const approveBtn = document.getElementById('approveButton');
      const rejectBtn = document.getElementById('rejectButton');
      
      statusDisplay.className = `status-${request.status}`;
      
      if (request.status === 'Pending') {
        statusDisplay.textContent = 'الحالة: معلق - مطلوب مراجعة';
        statusDisplay.style.color = '#f39c12';
        approveBtn.style.display = 'inline-block';
        rejectBtn.style.display = 'inline-block';
      } else if (request.status === 'Approved') {
        statusDisplay.textContent = `الحالة: مقبول ✅`;
        statusDisplay.style.color = '#2ecc71';
        approveBtn.style.display = 'none';
        rejectBtn.style.display = 'none';
      } else {
        statusDisplay.textContent = `الحالة: مرفوض ❌`;
        statusDisplay.style.color = '#e74c3c';
        approveBtn.style.display = 'none';
        rejectBtn.style.display = 'none';
      }

      document.getElementById('comparisonModal').style.display = 'block';
    }
    
    // ✅ يحول old_value/new_value (سواء كانت نص JSON أو object) إلى object عادي
    function toDataObject(data) {
      if (typeof data === 'string') {
        try {
          return JSON.parse(data);
        } catch (e) {
          return { 'البيانات': data };
        }
      }
      return (data && typeof data === 'object') ? data : {};
    }

    // ✅ بيرجع مصفوفة صفوف {field, oldVal, newVal} لكل الحقول اللي اتغيرت في الطلب
    function getComparisonRows(request) {
      const oldObj = toDataObject(request.old_value);
      const newObj = toDataObject(request.new_value);
      const keys = Array.from(new Set([...Object.keys(oldObj), ...Object.keys(newObj)]));
      return keys.map(k => ({
        field: k,
        oldVal: (oldObj[k] === undefined || oldObj[k] === null || oldObj[k] === '') ? '—' : oldObj[k],
        newVal: (newObj[k] === undefined || newObj[k] === null || newObj[k] === '') ? '—' : newObj[k]
      }));
    }

    function statusTextAr(status) {
      return status === 'Pending' ? 'معلق' : status === 'Approved' ? 'مقبول' : 'مرفوض';
    }

    function getCurrentlyFilteredRequests() {
      const status = document.getElementById('statusFilter').value;
      const searchTerm = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      let filtered = status ? allRequests.filter(r => r.status === status) : allRequests;

      if (searchTerm) {
        filtered = filtered.filter(r => {
          const code = (r.client_code || '').toLowerCase();
          const name = (r.client_name || '').toLowerCase();
          return code.includes(searchTerm) || name.includes(searchTerm);
        });
      }

      return filtered;
    }

    // ============================================================
    // 📊 تصدير Excel تفصيلي ومنظم وملون (ExcelJS)
    // ============================================================
    async function exportToExcel() {
      const dataToExport = getCurrentlyFilteredRequests();
      if (!dataToExport.length) {
        alert('لا توجد بيانات لتصديرها حسب الفلتر الحالي.');
        return;
      }
      if (typeof ExcelJS === 'undefined') {
        alert('تعذر تحميل مكتبة إنشاء Excel. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
        return;
      }

      const statusColors = { Pending: 'FFF39C12', Approved: 'FF2ECC71', Rejected: 'FFE74C3C' };
      const thinBorder = {
        top: { style: 'thin', color: { argb: 'FFE0E0E0' } },
        bottom: { style: 'thin', color: { argb: 'FFE0E0E0' } },
        left: { style: 'thin', color: { argb: 'FFE0E0E0' } },
        right: { style: 'thin', color: { argb: 'FFE0E0E0' } }
      };

      const wb = new ExcelJS.Workbook();
      wb.creator = 'نظام إدارة التمويل - كاريتاس مصر';
      wb.created = new Date();

      // ===== شيت 1: ملخص الطلبات =====
      const summarySheet = wb.addWorksheet('ملخص الطلبات', { views: [{ rightToLeft: true }] });
      summarySheet.columns = [
        { header: 'رقم الطلب', key: 'id', width: 12 },
        { header: 'رقم العملية', key: 'operation_id', width: 14 },
        { header: 'كود العميل', key: 'client_code', width: 14 },
        { header: 'اسم العميل', key: 'client_name', width: 22 },
        { header: 'مقدم الطلب', key: 'requested_by', width: 20 },
        { header: 'دور مقدم الطلب', key: 'requester_role', width: 16 },
        { header: 'تاريخ الطلب', key: 'created_at', width: 20 },
        { header: 'المراجعة الداخلية', key: 'review_status', width: 20 },
        { header: 'مسؤول المتابعة', key: 'followup_status', width: 20 },
        { header: 'موافقة مسئول المشروع', key: 'project_officer_status', width: 20 },
        { header: 'الادارة', key: 'admin_status', width: 20 },
        { header: 'الحالة', key: 'status', width: 14 },
        { header: 'ملاحظات مقدم الطلب', key: 'notes', width: 32 },
        { header: 'تمت المراجعة بواسطة', key: 'approved_by', width: 18 },
        { header: 'تاريخ المراجعة', key: 'approved_at', width: 20 }
      ];
      summarySheet.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1C3F66' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = thinBorder;
      });
      summarySheet.views = [{ state: 'frozen', ySplit: 1, rightToLeft: true }];
      summarySheet.autoFilter = { from: 'A1', to: 'O1' };

      const approvalColors = { 'approved-cell': 'FFE6FFE6', 'rejected-cell': 'FFFFE6E6' };

      dataToExport.forEach((r, idx) => {
        const row = summarySheet.addRow({
          id: r.id,
          operation_id: r.operation_id,
          client_code: r.client_code || '',
          client_name: r.client_name || '',
          requested_by: r.requested_by,
          requester_role: r.requester_role || 'غير محدد',
          created_at: new Date(r.created_at).toLocaleString('ar-EG'),
          review_status: r.review_status || '',
          followup_status: r.followup_status || '',
          project_officer_status: r.project_officer_status || '',
          admin_status: r.admin_status || '',
          status: statusTextAr(r.status),
          notes: r.notes || '',
          approved_by: r.approved_by || '',
          approved_at: r.approved_at ? new Date(r.approved_at).toLocaleString('ar-EG') : ''
        });
        row.eachCell(cell => {
          cell.alignment = { horizontal: 'right', vertical: 'middle', wrapText: true };
          cell.border = thinBorder;
        });
        if (idx % 2 === 1) {
          ['id', 'operation_id', 'client_code', 'client_name', 'requested_by', 'requester_role', 'created_at', 'notes', 'approved_by', 'approved_at']
            .forEach(key => { row.getCell(key).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF7F9FC' } }; });
        }
        ['review_status', 'followup_status', 'project_officer_status', 'admin_status'].forEach(key => {
          const cls = getApprovalCellClass(r[key]);
          if (cls) {
            row.getCell(key).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: approvalColors[cls] } };
            row.getCell(key).font = { bold: true, color: { argb: cls === 'approved-cell' ? 'FF008000' : 'FFCC0000' } };
          }
        });
        const statusCell = row.getCell('status');
        statusCell.font = { bold: true, color: { argb: 'FFFFFFFF' } };
        statusCell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: statusColors[r.status] || 'FF95A5A6' } };
        statusCell.alignment = { horizontal: 'center', vertical: 'middle' };
      });

      // ===== شيت 2: تفاصيل التغييرات =====
      const detailSheet = wb.addWorksheet('تفاصيل التغييرات', { views: [{ rightToLeft: true }] });
      detailSheet.columns = [
        { header: 'رقم الطلب', key: 'id', width: 10 },
        { header: 'رقم العملية', key: 'operation_id', width: 12 },
        { header: 'كود العميل', key: 'client_code', width: 14 },
        { header: 'اسم العميل', key: 'client_name', width: 20 },
        { header: 'مقدم الطلب', key: 'requested_by', width: 18 },
        { header: 'تاريخ الطلب', key: 'created_at', width: 18 },
        { header: 'الحالة', key: 'status', width: 12 },
        { header: 'الحقل', key: 'field', width: 26 },
        { header: 'القيمة قبل التعديل', key: 'oldVal', width: 28 },
        { header: 'القيمة المطلوبة', key: 'newVal', width: 28 }
      ];
      detailSheet.getRow(1).eachCell(cell => {
        cell.font = { bold: true, color: { argb: 'FFFFFFFF' }, size: 12 };
        cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFB3463A' } };
        cell.alignment = { horizontal: 'center', vertical: 'middle' };
        cell.border = thinBorder;
      });
      detailSheet.views = [{ state: 'frozen', ySplit: 1, rightToLeft: true }];
      detailSheet.autoFilter = { from: 'A1', to: 'J1' };

      let groupShaded = false;
      dataToExport.forEach(r => {
        const rows = getComparisonRows(r);
        const list = rows.length ? rows : [{ field: 'لا توجد حقول متغيرة', oldVal: '—', newVal: '—' }];
        groupShaded = !groupShaded;
        const startRowNum = detailSheet.rowCount + 1;

        list.forEach((item, i) => {
          const row = detailSheet.addRow({
            id: i === 0 ? r.id : '',
            operation_id: i === 0 ? r.operation_id : '',
            client_code: i === 0 ? (r.client_code || '') : '',
            client_name: i === 0 ? (r.client_name || '') : '',
            requested_by: i === 0 ? r.requested_by : '',
            created_at: i === 0 ? new Date(r.created_at).toLocaleString('ar-EG') : '',
            status: i === 0 ? statusTextAr(r.status) : '',
            field: item.field,
            oldVal: item.oldVal,
            newVal: item.newVal
          });
          row.eachCell(cell => {
            cell.alignment = { horizontal: 'right', vertical: 'middle', wrapText: true };
            cell.border = thinBorder;
          });
          if (groupShaded) {
            ['id', 'operation_id', 'client_code', 'client_name', 'requested_by', 'created_at', 'status', 'field']
              .forEach(key => { row.getCell(key).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFAFAFA' } }; });
          }
          row.getCell('oldVal').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFFBECEC' } };
          row.getCell('newVal').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFE8F8F5' } };
          const statusCellD = row.getCell('status');
          if (i === 0) {
            statusCellD.font = { bold: true, color: { argb: 'FFFFFFFF' } };
            statusCellD.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: statusColors[r.status] || 'FF95A5A6' } };
            statusCellD.alignment = { horizontal: 'center', vertical: 'middle' };
          }
        });

        // دمج خلايا بيانات الطلب الأساسية عبر كل صفوف التغييرات بتاعته
        if (list.length > 1) {
          const endRowNum = detailSheet.rowCount;
          ['A', 'B', 'C', 'D', 'E', 'F', 'G'].forEach(col => {
            detailSheet.mergeCells(`${col}${startRowNum}:${col}${endRowNum}`);
            detailSheet.getCell(`${col}${startRowNum}`).alignment = { vertical: 'middle', horizontal: 'right', wrapText: true };
          });
        }
      });

      const buffer = await wb.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/octet-stream' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `طلبات_التعديل_${new Date().toISOString().slice(0, 10)}.xlsx`;
      a.click();
      URL.revokeObjectURL(url);
    }

    // ============================================================
    // 🖨️ تصدير PDF — كل طلب في صفحة مستقلة (+ صفحة ملخص أولى)
    //    بيرسم كل صفحة كـ HTML بالعربي وياخد صورة منها بـ html2canvas
    //    عشان الخط العربي يظهر صح، وبعدين يحطها في صفحة PDF لوحدها.
    // ============================================================
    function buildSummaryPage(dataToExport) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed; top:0; left:-99999px; width:900px; background:#fff; padding:30px; font-family:Tajawal, Arial, sans-serif; direction:rtl; color:#142433;';

      let rowsHtml = dataToExport.map(req => `
        <tr>
          <td style="border:1px solid #ddd; padding:8px;">${req.id}</td>
          <td style="border:1px solid #ddd; padding:8px;">${req.operation_id}</td>
          <td style="border:1px solid #ddd; padding:8px;">${req.client_code || '—'}</td>
          <td style="border:1px solid #ddd; padding:8px;">${req.client_name || '—'}</td>
          <td style="border:1px solid #ddd; padding:8px;">${req.requested_by || '—'}</td>
          <td style="border:1px solid #ddd; padding:8px;">${new Date(req.created_at).toLocaleDateString('ar-EG')}</td>
          <td style="border:1px solid #ddd; padding:8px; font-weight:700;">${statusTextAr(req.status)}</td>
        </tr>
      `).join('');

      wrapper.innerHTML = `
        <h2 style="text-align:center;color:#b3463a;margin-top:0;">تقرير طلبات التعديل</h2>
        <p style="text-align:center;color:#666;font-size:13px;">
          تاريخ الإصدار: ${new Date().toLocaleString('ar-EG')} — عدد الطلبات: ${dataToExport.length}
        </p>
        <table style="width:100%; border-collapse:collapse; font-size:13px; margin-top:15px;">
          <thead>
            <tr>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">رقم الطلب</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">رقم العملية</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">كود العميل</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">اسم العميل</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">مقدم الطلب</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">التاريخ</th>
              <th style="border:1px solid #ddd; padding:8px; background:#1c3f66; color:#fff;">الحالة</th>
            </tr>
          </thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      `;
      return wrapper;
    }

    function buildRequestPage(req) {
      const wrapper = document.createElement('div');
      wrapper.style.cssText = 'position:fixed; top:0; left:-99999px; width:900px; background:#fff; padding:30px; font-family:Tajawal, Arial, sans-serif; direction:rtl; color:#142433;';

      const rows = getComparisonRows(req);
      const rowsHtml = rows.map(r => `
        <tr>
          <td style="border:1px solid #ddd; padding:8px; font-weight:700;">${r.field}</td>
          <td style="border:1px solid #ddd; padding:8px; background:#fbecec;">${r.oldVal}</td>
          <td style="border:1px solid #ddd; padding:8px; background:#e8f8f5;">${r.newVal}</td>
        </tr>
      `).join('');

      wrapper.innerHTML = `
        <div style="border:2px solid #1c3f66; border-radius:10px; padding:20px;">
          <h2 style="text-align:center;color:#b3463a;margin-top:0;">طلب تعديل رقم ${req.id}</h2>
          <div style="font-size:14px; margin-bottom:14px; line-height:1.9;">
            <strong>رقم العملية:</strong> ${req.operation_id} &nbsp;|&nbsp;
            <strong>الحالة:</strong> ${statusTextAr(req.status)}<br>
            <strong>كود العميل:</strong> ${req.client_code || '—'} &nbsp;|&nbsp;
            <strong>اسم العميل:</strong> ${req.client_name || '—'}<br>
            <strong>مقدم الطلب:</strong> ${req.requested_by || '—'} (${req.requester_role || 'غير محدد'})<br>
            <strong>تاريخ الطلب:</strong> ${new Date(req.created_at).toLocaleString('ar-EG')}
            ${req.approved_by ? '<br><strong>تمت المراجعة بواسطة:</strong> ' + req.approved_by : ''}
            ${req.approved_at ? '<br><strong>تاريخ المراجعة:</strong> ' + new Date(req.approved_at).toLocaleString('ar-EG') : ''}
          </div>
          <table style="width:100%; border-collapse:collapse; font-size:12px; margin-bottom:16px;">
            <thead>
              <tr>
                <th style="border:1px solid #ddd; padding:6px; background:#f2f2f2;">المراجعة الداخلية</th>
                <th style="border:1px solid #ddd; padding:6px; background:#f2f2f2;">مسؤول المتابعة</th>
                <th style="border:1px solid #ddd; padding:6px; background:#f2f2f2;">موافقة مسئول المشروع</th>
                <th style="border:1px solid #ddd; padding:6px; background:#f2f2f2;">الادارة</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="border:1px solid #ddd; padding:6px; text-align:center;">${req.review_status || '—'}</td>
                <td style="border:1px solid #ddd; padding:6px; text-align:center;">${req.followup_status || '—'}</td>
                <td style="border:1px solid #ddd; padding:6px; text-align:center;">${req.project_officer_status || '—'}</td>
                <td style="border:1px solid #ddd; padding:6px; text-align:center;">${req.admin_status || '—'}</td>
              </tr>
            </tbody>
          </table>
          ${req.notes ? `<div style="background:#f0f0f0; border-radius:6px; padding:10px; margin-bottom:16px; font-size:13px;"><strong>ملاحظات مقدم الطلب:</strong> ${req.notes}</div>` : ''}
          <table style="width:100%; border-collapse:collapse; font-size:13px;">
            <thead>
              <tr>
                <th style="border:1px solid #ddd; padding:8px; background:#f2f2f2;">الحقل</th>
                <th style="border:1px solid #ddd; padding:8px; background:#fbecec;">القيمة قبل التعديل</th>
                <th style="border:1px solid #ddd; padding:8px; background:#e8f8f5;">القيمة المطلوبة</th>
              </tr>
            </thead>
            <tbody>${rowsHtml || '<tr><td colspan="3" style="border:1px solid #ddd; padding:8px; text-align:center;">لا توجد حقول متغيرة</td></tr>'}</tbody>
          </table>
        </div>
      `;
      return wrapper;
    }

    // بيرسم عنصر HTML لصورة، ويحطها في صفحة PDF واحدة (يصغّرها لو أطول من الصفحة عشان متتقطعش)
    async function addElementAsPdfPage(pdf, element, isFirstPage) {
      document.body.appendChild(element);
      try {
        const canvas = await html2canvas(element, { backgroundColor: '#ffffff', scale: 1.5, useCORS: true });
        const pageWidth = pdf.internal.pageSize.getWidth();
        const pageHeight = pdf.internal.pageSize.getHeight();
        const margin = 8;
        const usableWidth = pageWidth - margin * 2;
        const usableHeight = pageHeight - margin * 2;

        let imgWidth = usableWidth;
        let imgHeight = (canvas.height * imgWidth) / canvas.width;
        if (imgHeight > usableHeight) {
          imgHeight = usableHeight;
          imgWidth = (canvas.width * imgHeight) / canvas.height;
        }
        const x = margin + (usableWidth - imgWidth) / 2;
        const y = margin;

        if (!isFirstPage) pdf.addPage();
        // ✅ JPEG بجودة 0.85 بدل PNG عشان نقلل حجم الملف جدًا (PNG كان بيطلّع ملفات ضخمة جدًا)
        const imgData = canvas.toDataURL('image/jpeg', 0.85);
        pdf.addImage(imgData, 'JPEG', x, y, imgWidth, imgHeight, undefined, 'FAST');
      } finally {
        document.body.removeChild(element);
      }
    }

    async function exportToPDF() {
      const dataToExport = getCurrentlyFilteredRequests();
      if (!dataToExport.length) {
        alert('لا توجد بيانات لتصديرها حسب الفلتر الحالي.');
        return;
      }
      if (typeof html2canvas === 'undefined' || !window.jspdf) {
        alert('تعذر تحميل مكتبات إنشاء PDF. تأكد من اتصالك بالإنترنت وحاول مرة أخرى.');
        return;
      }

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');

        await addElementAsPdfPage(pdf, buildSummaryPage(dataToExport), true);

        for (const req of dataToExport) {
          await addElementAsPdfPage(pdf, buildRequestPage(req), false);
        }

        const stamp = new Date().toISOString().slice(0, 10);
        pdf.save(`طلبات_التعديل_${stamp}.pdf`);
      } catch (e) {
        console.error('خطأ في إنشاء PDF:', e);
        alert('حدث خطأ أثناء إنشاء ملف PDF: ' + e.message);
      }
    }

    function renderComparisonData(data, elementId) {
      const container = document.getElementById(elementId);
      container.innerHTML = '';
      
      // إذا كانت البيانات نصًا، حاول تحويلها إلى JSON
      let dataObj = data;
      if (typeof data === 'string') {
        try {
          dataObj = JSON.parse(data);
        } catch (e) {
          dataObj = { 'البيانات': data };
        }
      }
      
      // إذا كانت البيانات object، اعرضها
      if (typeof dataObj === 'object' && dataObj !== null) {
        for (const key in dataObj) {
          if (dataObj.hasOwnProperty(key)) {
            const p = document.createElement('p');
            const value = dataObj[key];
            p.innerHTML = `<strong>${key}:</strong> ${value === null || value === undefined ? '—' : value}`;
            container.appendChild(p);
          }
        }
      } else {
        container.innerHTML = '<p>لا توجد بيانات للمقارنة</p>';
      }
    }

    function closeModal() {
      document.getElementById('comparisonModal').style.display = 'none';
      currentRequestId = null;
    }
    
    async function approveRequest(requestId) {
      if (!confirm("هل أنت متأكد من قبول طلب التعديل وتطبيق التغييرات؟")) return;

      const request = allRequests.find(r => r.id === requestId);
      if (!request) {
        alert("لم يتم العثور على الطلب!");
        return;
      }
      
      try {
        // ✅ تأكد أن new_value هو object وليس string
        let newData = request.new_value;
        
        // إذا كان new_value نصًا، حوله إلى object
        if (typeof newData === 'string') {
          try {
            newData = JSON.parse(newData);
          } catch (e) {
            console.error('خطأ في تحويل JSON:', e);
            alert('خطأ في تنسيق البيانات. الرجاء التحقق من الطلب.');
            return;
          }
        }
        
        // ✅ تسجيل البيانات للتصحيح
        console.log('بيانات التحديث:', {
          operation_id: request.operation_id,
          newData: newData,
          keys: Object.keys(newData)
        });
        
        // ✅ تحديث جدول العمليات
        const { data: updateResult, error: updateError } = await db
          .from('operations')
          .update(newData)
          .eq('id', request.operation_id)
          .select();  // إضافة select لرؤية النتيجة

        if (updateError) {
          console.error('خطأ في تحديث العمليات:', updateError);
          throw new Error(`خطأ في تحديث العمليات: ${updateError.message}`);
        }

        if (!updateResult || updateResult.length === 0) {
          throw new Error('لم يتم تحديث أي سجل، ربما operation_id غير صحيح');
        }
        
        // ✅ تحديث حالة الطلب مع معلومات الموافقة
        const { error: statusError } = await db
          .from('edit_requests')
          .update({ 
            status: 'Approved',
            approved_by: loggedInUser.full_name,
            approved_at: new Date().toISOString(),
            notified: true
          })
          .eq('id', requestId);

        if (statusError) {
          console.error('خطأ في تحديث حالة الطلب:', statusError);
          throw statusError;
        }

        alert(`✅ تمت الموافقة على الطلب رقم ${requestId} وتطبيق التعديلات بنجاح.`);
        closeModal();
        await loadRequests();
      } catch (e) {
        console.error('حدث خطأ:', e);
        alert(`❌ فشل الموافقة: ${e.message}\n\nتحقق من وحدة التحكم (F12) للمزيد من التفاصيل.`);
      }
    }

    async function rejectRequest(requestId) {
      if (!confirm("هل أنت متأكد من رفض طلب التعديل؟")) return;

      try {
        const { error: statusError } = await db
          .from('edit_requests')
          .update({ 
            status: 'Rejected',
            approved_by: loggedInUser.full_name,
            approved_at: new Date().toISOString(),
            notified: true
          })
          .eq('id', requestId);

        if (statusError) {
          console.error('خطأ في تحديث حالة الطلب:', statusError);
          throw statusError;
        }

        alert(`✅ تم رفض الطلب رقم ${requestId}.`);
        closeModal();
        await loadRequests();
      } catch (e) {
        console.error('حدث خطأ:', e);
        alert("❌ حدث خطأ أثناء الرفض: " + e.message);
      }
    }

    window.onclick = function(event) {
      if (event.target.id === 'comparisonModal') closeModal();
    };

    init().catch(err => {
      console.error('خطأ:', err);
      document.getElementById('requestsContainer').innerHTML = `<div class="status-Rejected">خطأ في التحميل: ${err.message}</div>`;
    });
  </script>
