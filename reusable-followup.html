<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اختبار مكوّن المتابعة - Reusable Followup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 40px 20px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #2e5c8a 0%, #c6a35f 50%, #2e5c8a 100%);
    }
    h2 { color: #142433; text-align: center; font-weight: 800; }
    p.desc { color: #64768a; text-align: center; margin-bottom: 30px; }
    .test-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 30px; }
    .test-buttons button {
      padding: 14px; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 14px;
    }
    .btn-review { background: #e67e22; }
    .btn-supervise { background: #34495e; }
    .btn-admin { background: #e74c3c; }
    .result-box {
      background: #f8f9fa; border: 1px solid #ddd; border-radius: 6px; padding: 15px;
      font-family: monospace; font-size: 13px; white-space: pre-wrap; min-height: 60px;
    }
    .result-title { font-weight: bold; margin-bottom: 8px; color: #2c3e50; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🧪 اختبار مكوّن المتابعة (Reusable Followup)</h2>
    <p class="desc">صفحة اختبار مستقلة — اضغط أي زرار عشان تفتح المودال وتجرب الحفظ، وهتشوف النتيجة اللي هترجع للـ callback تحت.</p>

    <div class="test-buttons">
      <button class="btn-review" onclick="testOpen('review')">تجربة review</button>
      <button class="btn-supervise" onclick="testOpen('supervise')">تجربة supervise</button>
      <button class="btn-admin" onclick="testOpen('admin')">تجربة admin</button>
    </div>

    <div class="result-title">آخر نتيجة محفوظة (اللي هتوصل للصفحة اللي بتستخدم المكوّن):</div>
    <div class="result-box" id="resultBox">لسه معملتش تجربة...</div>
  </div>

  <script src="reusable-followup.js"></script>
  <script>
    function testOpen(pageType) {
      // بيانات وهمية للتجربة فقط
      ReusableFollowup.openModal(
        'TEST-123',
        pageType,
        'لم تتم المراجعة',
        'تعليق تجريبي',
        function (recordId, status, comment, extraData) {
          document.getElementById('resultBox').textContent =
            'recordId: ' + recordId + '\n' +
            'pageType: ' + pageType + '\n' +
            'status: ' + status + '\n' +
            'comment: ' + comment + '\n' +
            'extraData: ' + JSON.stringify(extraData, null, 2);
        }
      );
    }
  </script>
</body>
</html>
