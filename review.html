<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>المراجعة الداخلية - نظام القروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    /* كل الـ CSS كما هو بدون تغيير */
    body { 
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; 
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0; 
      padding: 20px; 
      min-height: 100vh; 
    }
    .top-header {
      max-width: 1900px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #2980b9 0%, #1c3f66 100%);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(15, 40, 70, 0.4);
    }
    .top-header .brand { display: flex; align-items: center; gap: 10px; }
    .top-header .brand img { height: 34px; width: auto; filter: drop-shadow(0 2px 6px rgba(15, 40, 70, 0.25)); }
    .top-header .brand span { color: white; font-weight: 800; font-size: 14px; }
    .top-header .nav-actions { display: flex; gap: 10px; }
    .top-header .nav-actions a, .top-header .nav-actions button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background 0.2s ease;
    }
    .top-header .nav-actions a:hover, .top-header .nav-actions button:hover {
      background: rgba(255,255,255,0.28);
    }
    .container { 
      max-width: 1900px; 
      margin: 0 auto; 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #2980b9 0%, #1c3f66 50%, #2980b9 100%);
    }
    h2 { 
      text-align: center; 
      color: #142433; 
      margin-top: 0; 
      font-size: 26px; 
      font-weight: 800;
      margin-bottom: 10px; 
    }
    .stats { 
      display: flex; 
      gap: 20px; 
      justify-content: center; 
      margin-bottom: 20px; 
    }
    .stat-card { 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      padding: 15px 30px; 
      border-radius: 8px; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4); 
      transition: transform 0.3s; 
    }
    .stat-card:hover { 
      transform: translateY(-5px); 
    }
    .stat-card .label { 
      font-size: 14px; 
      opacity: 0.9; 
    }
    .stat-card .value { 
      font-size: 24px; 
      font-weight: bold; 
      margin-top: 5px; 
    }
    .filters { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
      margin: 20px 0; 
      padding: 15px; 
      background: #f8f9fa; 
      border-radius: 8px; 
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filter-label {
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 2px;
    }
    select, input { 
      width: 100%; 
      padding: 10px; 
      border: 2px solid #e0e0e0; 
      border-radius: 6px; 
      transition: all 0.3s; 
      font-size: 14px; 
    }
    select:focus, input:focus { 
      outline: none; 
      border-color: #3498db; 
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1); 
    }
    .committee-filter {
      position: relative;
      grid-column: span 2;
    }
    .committee-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border: 2px solid #3498db;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      width: 100%;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .committee-dropdown.show {
      display: block;
    }
    .committee-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .committee-item:hover {
      background: #f0f4f8;
    }
    .committee-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .committee-toggle {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      background: white;
      text-align: right;
    }
    .committee-toggle:hover {
      border-color: #3498db;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    th, td { 
      border: 1px solid #e0e0e0; 
      padding: 12px 8px; 
      text-align: right; 
      font-size: 13px; 
    }
    th { 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    th input, th select { 
      width: 95%; 
      padding: 6px; 
      margin-top: 8px; 
      border: 1px solid #fff; 
      border-radius: 4px; 
      font-size: 12px; 
      background: rgba(255,255,255,0.95); 
    }
    tr:nth-child(even) { 
      background-color: #f8f9fa; 
    }
    tr:hover:not(.detail-row) { 
      background-color: #e3f2fd; 
      transition: background-color 0.3s; 
    }
    .expand-btn { 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.3s; 
      font-weight: bold; 
    }
    .actions-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 150px;
    }
    .actions-cell button {
      width: 100%;
      margin: 0;
      white-space: nowrap;
    }
    .expand-btn:hover { 
      transform: scale(1.1); 
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4); 
    }
    .history-btn {
      background: linear-gradient(135deg, #a3813f 0%, #6b5628 100%);
      color: white;
      border: none;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      font-size: 10px;
      white-space: nowrap;
    }
    .history-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(107, 86, 40, 0.4);
    }
    .history-btn.disabled {
      background: #e8e8e8;
      color: #aaa;
      cursor: not-allowed;
    }
    .history-btn.disabled:hover {
      transform: none;
      box-shadow: none;
    }
    .detail-row { 
      display: none; 
      background: #f0f4f8; 
    }
    .detail-row td { 
      padding: 20px; 
      line-height: 1.8; 
    }
    .loading { 
      text-align: center; 
      padding: 40px; 
      color: #777; 
    }
    .error { 
      color: #e74c3c; 
      text-align: center; 
      padding: 20px; 
    }
    .btn-apply { 
      grid-column: span 2; 
      padding: 12px; 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .btn-apply:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4); 
    }
    .selected-committees {
      font-size: 12px;
      color: #3498db;
      margin-top: 4px;
    }
    /* -------------------------------------- */
    /* ألوان المقبول والمرفوض */
    .approved-cell {
      background-color: #e6ffe6; 
      color: #008000; 
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    .rejected-cell {
      background-color: #ffe6e6; 
      color: #cc0000; 
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
    }
    /* -------------------------------------- */
    /* تنسيقات التفاصيل */
    .detail-container {
        padding: 10px;
    }
    .detail-row-sections {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px dashed #d0d0d0;
    }
    .detail-section h3 {
        color: #3498db;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #3498db;
        padding-bottom: 5px;
    }
    .detail-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .detail-label {
        font-weight: bold;
        color: #2c3e50;
        flex-basis: 50%;
        text-align: right;
        padding-left: 10px;
    }
    .detail-value {
        flex-basis: 50%;
        text-align: left;
        color: #555;
    }
    .detail-section-full h3 {
        color: #2ecc71;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #2ecc71;
        padding-bottom: 5px;
    }
    /* زر التعديل */
    .edit-btn {
      background: linear-gradient(135deg, #f39c12 0%, #e67e22 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin: 2px;
      font-weight: bold;
      transition: all 0.3s;
      width: auto;
    }
    .edit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
    }
    /* Modal Styles */
    .modal { 
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.6); 
      overflow-y: auto;
      padding: 20px 0;
    }
    .modal-content { 
      background: white; 
      margin: 4% auto; 
      padding: 30px 30px 0 30px; 
      width: 90%;
      max-width: 550px; 
      border-radius: 12px; 
      max-height: 88vh; 
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-content h3 {
      color: #3498db;
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
      border-bottom: 3px solid #3498db;
      padding-bottom: 10px;
    }
    .modal label { 
      display: block; 
      margin: 12px 0 5px; 
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
    }
    .modal input, .modal textarea, .modal select { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 15px;
      border: 2px solid #b3d3ed;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .modal input:focus, .modal textarea:focus, .modal select:focus {
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
      outline: none;
    }
    .modal button { 
      width: auto; 
      margin: 10px 5px 0; 
      padding: 12px 30px;
      font-size: 16px;
    }
    .modal .btn-save {
      background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
    }
    .modal .btn-close {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }
    .modal .button-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      position: sticky;
      bottom: 0;
      background: white;
      margin: 20px -30px 0 -30px;
      padding: 15px 30px 22px;
      border-top: 2px solid #b3d3ed;
      box-shadow: 0 -6px 14px rgba(0,0,0,0.08);
    }
    /* زر التصدير */
    .export-btn {
      background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin: 2px;
      font-weight: bold;
      transition: all 0.3s;
      width: auto;
    }
    .export-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(155, 89, 182, 0.4);
    }
  
    /* ========== تجاوب الشاشة (Responsive) ========== */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      border-radius: 8px;
    }
    .table-wrapper table {
      min-width: 900px;
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .container { padding: 15px; }
      .top-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 12px 16px;
      }
      .top-header .brand { justify-content: center; }
      .top-header .nav-actions { justify-content: center; }
      .filters {
        grid-template-columns: 1fr 1fr;
        padding: 10px;
        gap: 10px;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      table th, table td {
        padding: 6px 8px !important;
        font-size: 12px !important;
      }
      .modal-content {
        width: 95% !important;
        padding-left: 15px !important;
        padding-right: 15px !important;
        margin: 3% auto !important;
      }
      .form-grid, .details-grid, .comparison-grid {
        grid-template-columns: 1fr !important;
      }
    }

    @media (max-width: 520px) {
      .filters { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr !important; }
      h2 { font-size: 20px !important; }
      .top-header .brand span { font-size: 12px; }
      .top-header .nav-actions a, .top-header .nav-actions button {
        padding: 7px 12px;
        font-size: 12px;
      }
    }

  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand">
      <img src="logo.png" alt="Caritas Egypt" />
      <span>نظام إدارة التمويل</span>
    </div>
    <div class="nav-actions">
      <a href="index.html">🏠 الرئيسية</a>
      <button onclick="pageLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="container">
    <h2>📋 سجلات المراجعة الداخلية</h2>

    <div class="stats">
      <div class="stat-card">
        <div class="label">إجمالي السجلات</div>
        <div class="value" id="totalRecords">0</div>
      </div>
      <div class="stat-card">
        <div class="label">مجموع المبالغ</div>
        <div class="value" id="totalAmount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">تم التحويل</div>
        <div class="value" id="transferredCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">قيد المراجعة</div>
        <div class="value" id="pendingCount">0</div>
      </div>
    </div>

    <div class="filters" id="filters">
      <div class="filter-group">
        <label class="filter-label">الفرع</label>
        <select id="filterBranch">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">المراجعة الداخلية</label>
        <select id="filterReview">
          <option value="">الكل</option>
          <optgroup label="📝 تحت الإجراء والمراجعة">
        <option value="لم تتم المراجعة">لم تتم المراجعة</option>
        <option value="تحت المراجعة للنقاش">تحت المراجعة للنقاش</option>
        <option value="تحت العرض والمناقشة">تحت العرض والمناقشة</option>
        <option value="مرسل ميل بالملاحظات فى انتظار الرد">مرسل ميل بالملاحظات فى انتظار الرد</option>
        <option value="مطلوب ارسال الملف على الميل">مطلوب ارسال الملف على الميل</option>
        <option value="يرجى استكمال باقى الملاحظات للمراجعة والموافقة">يرجى استكمال باقى الملاحظات الموجودة لاتمام عمليه المراجعة و الموافقه</option>
        <option value="موقع لاستكمال الموافقة علي تمويل العميل">الموقع لاستكمال الموافقة علي تمويل العميل</option>
    </optgroup>

    <optgroup label="💬 تعليقات ومتطلبات إضافية">
        <option value="هناك تعليق تحت مراجعة التعليقات">هناك تعليق تحت مراجعة التعليقات</option>
        <option value="مناقشه المبلغ">مناقشه المبلغ</option>
        <option value="مطلوب تغيير الضامن">مطلوب تغيير الضامن</option>
        <option value="مطلوب عمل استثناء الـ iScore">مطلوب عمل استثناء الـ iScore</option>
    </optgroup>

    <optgroup label="✅ الموافقات والقبول">
        <option value="تحت العرض لاخذ الموافقة النهائية">تحت العرض لاخذ الموافقة النهائية</option>
        <option value="تمت المراجعة مقبول">تمت المراجعة مقبول</option>
        <option value="تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة">تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة</option>
        <option value="سداد معجل">سداد معجل</option>
    </optgroup>

    <optgroup label="❌ حالات الرفض والإلغاء">
        <option value="تمت المراجعة مرفوض">تمت المراجعة مرفوض</option>
        <option value="مرفوض من اداره الائتمان">مرفوض من اداره الائتمان</option>
        <option value="عدد القروض الموجودة للعميل أكبر من الحد المسموح به">عدد القروض الموجودة للعميل أكبر من الحد المسموح به (Exceeded Limit)</option>
        <option value="تاريخ الاستعلام قديم. يرجى عمل استعلام جديد">تاريخ الاستعلام الخاص بالعميل قديم. يرجى عمل استعلام جديد، حيث لا يعتد بالاستعلام الحالي</option>
        <option value="تم الغاء الطلب من العميل">تم الغاء الطلب من العميل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">مسؤول المتابعة</label>
        <select id="filterSupervisor">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">الإدارة</label>
        <select id="filterAdmin">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">اسم الأخصائي</label>
        <select id="filterOfficer">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">تم التحويل</label>
        <select id="filterTransferred">
          <option value="">الكل</option>
          <option value="true">نعم</option>
          <option value="false">لا</option>
        </select>
      </div>
      
      <div class="filter-group committee-filter">
        <label class="filter-label">رقم اللجنة</label>
        <div class="committee-toggle" onclick="toggleCommitteeDropdown()">
          <span>اختر اللجان</span>
          <div class="selected-committees" id="selectedCommitteesText"></div>
        </div>
        <div class="committee-dropdown" id="committeeDropdown"></div>
      </div>
      
      <button onclick="resetFilters()" class="btn-apply">🔄 إعادة تعيين الفلاتر</button>
      <button onclick="exportToExcel()" id="exportBtn" class="btn-apply" style="background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);">📊 تصدير للإكسل</button>
    </div>

    <div class="table-wrapper">
      <div id="tableContainer">
        <div class="loading">جاري تحميل البيانات...</div>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>تعديل المراجعة الداخلية</h3>
      <input type="hidden" id="editRecordId" />
      <label>القائم بالزيارة</label>
      <input type="text" id="editVisitor" />
      <label>حالة المراجعة</label>
      <select id="editReviewStatus">
        <optgroup label="📝 تحت الإجراء والمراجعة">
        <option value="لم تتم المراجعة">لم تتم المراجعة</option>

        <option value="موقع لاستكمال الموافقة علي تمويل العميل">الموقع لاستكمال الموافقة علي تمويل العميل</option>

        <option value="مناقشه المبلغ">مناقشه المبلغ</option>
        <option value="مطلوب تغيير الضامن">مطلوب تغيير الضامن</option>
        <option value="مطلوب عمل استثناء الـ iScore">مطلوب عمل استثناء الـ iScore</option>
    </optgroup>

    <optgroup label="✅ الموافقات والقبول">
        <option value="تحت العرض لاخذ الموافقة النهائية">تحت العرض لاخذ الموافقة النهائية</option>
        <option value="تمت المراجعة مقبول">تمت المراجعة مقبول</option>
        <option value="تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة">تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة</option>
        <option value="سداد معجل">سداد معجل</option>
    </optgroup>

    <optgroup label="❌ حالات الرفض والإلغاء">
        <option value="تمت المراجعة مرفوض">تمت المراجعة مرفوض</option>
        <option value="مرفوض من اداره الائتمان">مرفوض من اداره الائتمان</option>
        <option value="عدد القروض الموجودة للعميل أكبر من الحد المسموح به">عدد القروض الموجودة للعميل أكبر من الحد المسموح به (Exceeded Limit)</option>
        <option value="تاريخ الاستعلام قديم. يرجى عمل استعلام جديد">تاريخ الاستعلام الخاص بالعميل قديم. يرجى عمل استعلام جديد، حيث لا يعتد بالاستعلام الحالي</option>
        <option value="تم الغاء الطلب من العميل">تم الغاء الطلب من العميل</option>
      </select>
      <label>ملاحظات المراجعة</label>
      <textarea id="editReviewNotes" rows="3"></textarea>
      <div class="button-group">
        <button onclick="saveReview()" class="btn-save">💾 حفظ</button>
        <button onclick="closeModal()" class="btn-close">❌ إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    function pageLogout() {
      if (confirm("هل تريد تسجيل الخروج من النظام؟")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    // ======== التغيير الوحيد: استبدل supabase بـ mySupabase ========
    const mySupabase = window.supabase.createClient(
      'https://akjyrmmqsnxdbkslxmvb.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFranlybW1xc254ZGJrc2x4bXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODUxODcsImV4cCI6MjA4MDQ2MTE4N30.EuTd_i9fEecFGJG89PhRa3z68k5x6nflOW6fvqvMQJM'
    );

    let allData = [];
    let userRole = '';
    let userBranches = [];
    let filteredData = [];
    let selectedCommittees = [];
    let columnFilters = {
      nationalId: '',
      clientId: '',
      clientName: '',
      project: '',
      guarantorId: '',
      guarantorName: ''
    };
    let searchTimeout = null;

    async function init() {
      const userId = localStorage.getItem('loggedInUserId');
      if (!userId) {
        alert("الرجاء تسجيل الدخول أولًا!");
        window.location.href = "index.html";
        return;
      }

      // ======== التغيير: استخدم mySupabase بدلاً من supabase ========
      const { data: user, error } = await mySupabase
        .from('users')
        .select('role, branches')
        .eq('id', userId)
        .single();

      if (error) throw error;
      userRole = user.role;
      userBranches = user.branches || [];

      // التحقق من صلاحية المراجعة الداخلية
      if (userRole !== 'internal_reviewer') {
        alert("ليس لديك صلاحية الوصول إلى هذه الصفحة!");
        window.location.href = "index.html";
        return;
      }

      await loadOldCommitteesNidSet();
      await loadData();
      
      // إغلاق dropdown اللجان عند الضغط خارجها
      document.addEventListener('click', function(e) {
        if (!e.target.closest('.committee-filter')) {
          document.getElementById('committeeDropdown').classList.remove('show');
        }
      });
    }

    async function loadData() {
      // ======== التغيير: استخدم mySupabase بدلاً من supabase ========
      let query = mySupabase.from('operations_with_details').select('*');
      
      // تطبيق فلتر الفروع للمراجع الداخلي
      if (userBranches && userBranches.length > 0) {
        query = query.in('الفرع', userBranches);
      }
      
      const { data, error } = await query.order('created_at', { ascending: false });
      if (error) {
        document.getElementById('tableContainer').innerHTML = `<div class="error">خطأ في تحميل البيانات: ${error.message}</div>`;
        console.error('خطأ في تحميل البيانات:', error);
        return;
      }
      
      allData = data || [];
      filteredData = [...allData];
      renderFilters();
      renderTable(filteredData);
      updateStats(filteredData);
    }

    function renderFilters() {
      let branches = [];
      if (userBranches) {
        branches = userBranches;
      } else {
        branches = [...new Set(allData.map(row => row["الفرع"]).filter(v => v && v.trim()))];
      }

      const branchSelect = document.getElementById('filterBranch');
      branches.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        branchSelect.appendChild(opt);
      });

      const reviews = [...new Set(allData.map(row => row["المراجعة الداخلية"]).filter(v => v && v.trim()))];
      const supervisors = [...new Set(allData.map(row => row["مسؤول المتابعة"]).filter(v => v && v.trim()))];
      const admins = [...new Set(allData.map(row => row["الادارة"]).filter(v => v && v.trim()))];
      const officers = [...new Set(allData.map(row => row["اسم الاخصائى"]).filter(v => v && v.trim()))];
      const committees = [...new Set(allData.map(row => row["رقم اللجنة"]).filter(v => v && v.trim()))].sort();

      const selects = [
        { id: 'filterSupervisor', data: supervisors },
        { id: 'filterAdmin', data: admins },
        { id: 'filterOfficer', data: officers }
      ];

      selects.forEach(item => {
        const select = document.getElementById(item.id);
        item.data.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          select.appendChild(opt);
        });
      });

      // إنشاء checkboxes للجان
      const dropdown = document.getElementById('committeeDropdown');
      dropdown.innerHTML = '';
      committees.forEach(committee => {
        const div = document.createElement('div');
        div.className = 'committee-item';
        div.innerHTML = `
          <input type="checkbox" id="comm_${committee}" value="${committee}" onchange="updateSelectedCommittees()">
          <label for="comm_${committee}">${committee}</label>
        `;
        dropdown.appendChild(div);
      });

      // إضافة مستمعات للفلاتر العامة
      ['filterBranch', 'filterReview', 'filterSupervisor', 'filterAdmin', 'filterOfficer', 'filterTransferred'].forEach(id => {
        document.getElementById(id).addEventListener('change', applyAllFilters);
      });
    }

    function toggleCommitteeDropdown() {
      const dropdown = document.getElementById('committeeDropdown');
      dropdown.classList.toggle('show');
    }

    function updateSelectedCommittees() {
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      selectedCommittees = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
      
      const text = document.getElementById('selectedCommitteesText');
      if (selectedCommittees.length > 0) {
        text.textContent = `تم اختيار ${selectedCommittees.length} لجنة`;
      } else {
        text.textContent = '';
      }
      
      applyAllFilters();
    }

    function applyAllFilters() {
      const branch = document.getElementById('filterBranch').value;
      const review = document.getElementById('filterReview').value;
      const supervisor = document.getElementById('filterSupervisor').value;
      const admin = document.getElementById('filterAdmin').value;
      const officer = document.getElementById('filterOfficer').value;
      const transferred = document.getElementById('filterTransferred').value;

      filteredData = allData.filter(row => {
        // الفلاتر العامة
        if (branch && row["الفرع"] !== branch) return false;
        if (review && row["المراجعة الداخلية"] !== review) return false;
        if (supervisor && row["مسؤول المتابعة"] !== supervisor) return false;
        if (admin && row["الادارة"] !== admin) return false;
        if (officer && row["اسم الاخصائى"] !== officer) return false;
        if (transferred !== '') {
          const isTransferred = row["تم التحويل"] === true;
          if (transferred === 'true' && !isTransferred) return false;
          if (transferred === 'false' && isTransferred) return false;
        }
        
        // فلتر اللجان (multi-select)
        if (selectedCommittees.length > 0) {
          if (!selectedCommittees.includes(row["رقم اللجنة"])) return false;
        }

        // فلاتر الأعمدة
        if (columnFilters.nationalId && !row["رقم البطاقة العميل"]?.toLowerCase().includes(columnFilters.nationalId)) return false;
        if (columnFilters.clientId && !row["كود_العميل"]?.toLowerCase().includes(columnFilters.clientId)) return false;
        if (columnFilters.clientName) {
          const name1 = row["اسم_العميل"]?.toLowerCase() || '';
          const name2 = row["اسم_العميل_من_التقييم"]?.toLowerCase() || '';
          if (!name1.includes(columnFilters.clientName) && !name2.includes(columnFilters.clientName)) return false;
        }
        if (columnFilters.project && !row["المشروع"]?.toLowerCase().includes(columnFilters.project)) return false;
        if (columnFilters.guarantorId && !row["رقم بطاقة الضامن"]?.toLowerCase().includes(columnFilters.guarantorId)) return false;
        if (columnFilters.guarantorName && !row["اسم_الضامن"]?.toLowerCase().includes(columnFilters.guarantorName)) return false;

        return true;
      });

      renderTable(filteredData);
      updateStats(filteredData);
    }

    function updateColumnFilter(field, value) {
      columnFilters[field] = value.toLowerCase();
      
      // إلغاء البحث السابق
      if (searchTimeout) {
        clearTimeout(searchTimeout);
      }
      
      // الانتظار قبل البحث
      searchTimeout = setTimeout(() => {
        applyAllFilters();
      }, 1000);
    }
    
    function searchOnEnter(event, field, value) {
      if (event.key === 'Enter') {
        if (searchTimeout) {
          clearTimeout(searchTimeout);
        }
        columnFilters[field] = value.toLowerCase();
        applyAllFilters();
      }
    }

    function resetFilters() {
      document.getElementById('filterBranch').value = '';
      document.getElementById('filterReview').value = '';
      document.getElementById('filterSupervisor').value = '';
      document.getElementById('filterAdmin').value = '';
      document.getElementById('filterOfficer').value = '';
      document.getElementById('filterTransferred').value = '';
      
      // إعادة تعيين checkboxes اللجان
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = false);
      selectedCommittees = [];
      document.getElementById('selectedCommitteesText').textContent = '';
      
      // إعادة تعيين فلاتر الأعمدة
      columnFilters = {
        nationalId: '',
        clientId: '',
        clientName: '',
        project: '',
        guarantorId: '',
        guarantorName: ''
      };
      
      filteredData = [...allData];
      renderTable(filteredData);
      updateStats(filteredData);
    }

    function updateStats(data) {
      document.getElementById('totalRecords').textContent = data.length.toLocaleString('ar-EG');
      
      const total = data.reduce((sum, row) => {
        const amount = parseFloat(row["المبلغ المطلوب"]) || 0;
        return sum + amount;
      }, 0);
      
      document.getElementById('totalAmount').textContent = total.toLocaleString('ar-EG') + ' ج.م';
      
      // حساب عدد التي تم تحويلها
      const transferredCount = data.filter(row => row["تم التحويل"] === true).length;
      document.getElementById('transferredCount').textContent = transferredCount;
      
      // حساب عدد قيد المراجعة
      const pendingCount = data.filter(row => row["المراجعة الداخلية"] === 'لم تتم المراجعة').length;
      document.getElementById('pendingCount').textContent = pendingCount;
    }

    function renderTable(data) {
      const container = document.getElementById('tableContainer');
      
      if (!data || data.length === 0) {
        container.innerHTML = '<div class="loading">لا توجد بيانات</div>';
        return;
      }

      let html = `
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>
                رقم بطاقة العميل
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.nationalId}" 
                  oninput="updateColumnFilter('nationalId', this.value)"
                  onkeypress="searchOnEnter(event, 'nationalId', this.value)" />
              </th>
              <th>
                كود العميل
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.clientId}" 
                  oninput="updateColumnFilter('clientId', this.value)"
                  onkeypress="searchOnEnter(event, 'clientId', this.value)" />
              </th>
              <th>
                اسم العميل
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.clientName}" 
                  oninput="updateColumnFilter('clientName', this.value)"
                  onkeypress="searchOnEnter(event, 'clientName', this.value)" />
              </th>
              <th>رقم الحساب</th>
              <th>الإحداثيات</th>
              <th>الاسم من I-Score</th>
              <th>
                المشروع
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.project}" 
                  oninput="updateColumnFilter('project', this.value)"
                  onkeypress="searchOnEnter(event, 'project', this.value)" />
              </th>
              <th>
                رقم بطاقة الضامن
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.guarantorId}" 
                  oninput="updateColumnFilter('guarantorId', this.value)"
                  onkeypress="searchOnEnter(event, 'guarantorId', this.value)" />
              </th>
              <th>
                اسم الضامن
                <input type="text" placeholder="اكتب واضغط Enter..." 
                  value="${columnFilters.guarantorName}" 
                  oninput="updateColumnFilter('guarantorName', this.value)"
                  onkeypress="searchOnEnter(event, 'guarantorName', this.value)" />
              </th>
              <th>المبلغ</th>
              <th>الأخصائي</th>
              <th>تم التحويل</th>
              <th>المراجعة</th>
              <th>المتابعة</th>
              <th>الإدارة</th>
              <th>رقم اللجنة</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="tableBody">
      `;

      window.currentTableData = data;

      data.forEach((row, idx) => {
        const hasHistory = window.oldCommitteesNids && window.oldCommitteesNids.has(row["رقم البطاقة العميل"]);
        const historyBtnHtml = hasHistory
          ? `<button class="history-btn" onclick="openClientHistory(${idx})" title="يوجد لجان قديمة لهذا العميل">📜 لجان قديمة</button>`
          : `<button class="history-btn disabled" disabled title="لا توجد لجان قديمة مسجلة لهذا العميل">📜 لجان قديمة</button>`;
        const getCellClass = (value) => {
          if (!value) return '';
          const lowerValue = value.toLowerCase();

          if (lowerValue.includes('مقبول')) {
            return 'approved-cell';
          }

          if (lowerValue.includes('مرفوض') || lowerValue.includes('ملغي') || lowerValue.includes('الغاء')) {
            return 'rejected-cell';
          }

          return '';
        };

        const reviewClass = getCellClass(row["المراجعة الداخلية"]);
        const supervisorClass = getCellClass(row["مسؤول المتابعة"]);
        const adminClass = getCellClass(row["الادارة"]);

        html += `
          <tr>
            <td>${idx + 1}</td>
            <td>${row["رقم البطاقة العميل"] || '—'}</td>
            <td>${row["كود_العميل"] || '—'}</td>
            <td>${row["اسم_العميل"] || row["اسم_العميل_من_التقييم"] || '—'}</td>
            <td style="font-size: 10px;">${row["رقم_الحساب_من_التقييم"] || '—'}</td>
            <td style="font-size: 9px;">${row["احداثيات الموقع"] ? row["احداثيات الموقع"].substring(0, 20) + '...' : '—'}</td>
            <td>${row["الاسم_من_الاي_سكور"] || '—'}</td>
            <td>${row["المشروع"] || '—'}</td>
            <td>${row["رقم بطاقة الضامن"] || '—'}</td>
            <td>${row["اسم_الضامن"] || '—'}</td>
            <td style="font-weight: bold; color: #e67e22;">${row["المبلغ المطلوب"] || '—'}</td>
            <td>${row["اسم الاخصائى"] || '—'}</td>
            <td>${row["تم التحويل"] ? '<span style="color: #2ecc71;">✓ نعم</span>' : '<span style="color: #e74c3c;">✗ لا</span>'}</td>
            <td><span class="${reviewClass}">${row["المراجعة الداخلية"] || '—'}</span></td>
            <td><span class="${supervisorClass}">${row["مسؤول المتابعة"] || '—'}</span></td>
            <td><span class="${adminClass}">${row["الادارة"] || '—'}</span></td>
            <td>${row["رقم اللجنة"] || '—'}</td>
            <td class="actions-cell">
              <button class="edit-btn" onclick="openEditModal('${row.id}')">✏️ تعديل</button>
              <button class="expand-btn" onclick="toggleDetail(${idx}, event)">📄 تفاصيل</button>
              ${historyBtnHtml}
            </td>
          </tr>
          <tr class="detail-row" id="detail-${idx}">
            <td colspan="19">
              <div class="detail-container">
                
                <div class="detail-row-sections">
                  
                  <div class="detail-section">
                    <h3>📋 معلومات العملية</h3>
                    <div class="detail-item">
                      <span class="detail-label">رقم البطاقة:</span>
                      <span class="detail-value">${row["رقم البطاقة العميل"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">كود العميل:</span>
                      <span class="detail-value">${row["كود_العميل"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">المبلغ المطلوب:</span>
                      <span class="detail-value" style="color: #e67e22; font-weight: bold;">${row["المبلغ المطلوب"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">عدد أيام التأخير:</span>
                      <span class="detail-value">${row["عدد ايام التاخير"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">عدد الأقساط:</span>
                      <span class="detail-value">${row["عدد الاقساط"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">المنطقة:</span>
                      <span class="detail-value">${row["المنطقه"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">الفرع:</span>
                      <span class="detail-value">${row["الفرع"] || '—'}</span>
                    </div>
                  </div>

                  <div class="detail-section">
                    <h3>💰 بيانات القرض</h3>
                    <div class="detail-item">
                      <span class="detail-label">تاريخ القرض:</span>
                      <span class="detail-value">${row["تاريخ_القرض"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">أخصائي القرض:</span>
                      <span class="detail-value">${row["اخصائى_القرض"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">النشاط الثاني:</span>
                      <span class="detail-value">${row["النشاط_الثانى"] || '—'}</span>
                    </div>
                    <div class="detail-item">
                      <span class="detail-label">فرع العميل:</span>
                      <span class="detail-value">${row["فرع_العميل_من_القروض"] || '—'}</span>
                    </div>
                  </div>

                  <div class="detail-section">
                    <h3>📊 تقييم العميل</h3>
                    <div class="detail-item">
                      <span class="detail-label">الاسم من I-Score:</span>
                      <span class="detail-value">${row["الاسم_من_الاي_سكور"] || '—'}</div>
                      <div class="detail-item">
                        <span class="detail-label">رقم الحساب:</span>
                        <span class="detail-value">${row["رقم_الحساب_من_التقييم"] || '—'}</div>
                        <div class="detail-item">
                          <span class="detail-label">نتيجة التقييم:</span>
                          <span class="detail-value">${row["نتيجة_التقييم"] || '—'}</div>
                          <div class="detail-item">

    function toggleDetail(index, event) {
      const detailRow = document.getElementById(`detail-${index}`);
      const btn = event.target;
      const row = btn.closest('tr');
      
      if (detailRow.style.display === 'none' || !detailRow.style.display) {
        // إخفاء جميع الصفوف التفصيلية الأخرى
        document.querySelectorAll('.detail-row').forEach(row => {
          row.style.display = 'none';
        });
        // إعادة أزرار التفاصيل الأخرى
        document.querySelectorAll('.expand-btn').forEach(button => {
          button.textContent = '📄 تفاصيل';
          button.style.background = 'linear-gradient(135deg, #3498db 0%, #2980b9 100%)';
        });
        
        // عرض الصف التفصيلي تحته مباشرة
        detailRow.style.display = 'table-row';
        btn.textContent = 'إخفاء';
        btn.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
        
        // التمرير إلى الصف التفصيلي
        setTimeout(() => {
          detailRow.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }, 100);
      } else {
        detailRow.style.display = 'none';
        btn.textContent = '📄 تفاصيل';
        btn.style.background = 'linear-gradient(135deg, #3498db 0%, #2980b9 100%)';
      }
    }

    function openEditModal(recordId) {
      const record = allData.find(r => r.id == recordId);
      if (!record) return;

      document.getElementById('editRecordId').value = record.id;
      document.getElementById('editVisitor').value = record["القائم بالزياره"] || '';
      document.getElementById('editReviewStatus').value = record["المراجعة الداخلية"] || 'لم تتم المراجعة';
      document.getElementById('editReviewNotes').value = record["ملاحظات المراجعة الداخلية"] || '';

      document.getElementById('editModal').style.display = 'block';
    }

    async function saveReview() {
      const id = document.getElementById('editRecordId').value;
      if (!id) {
        alert("⚠️ لم يتم تحديد السجل!");
        return;
      }

      const updates = {
        "القائم بالزياره": document.getElementById('editVisitor').value.trim() || null,
        "المراجعة الداخلية": document.getElementById('editReviewStatus').value,
        "ملاحظات المراجعة الداخلية": document.getElementById('editReviewNotes').value.trim() || null
      };

      try {
        // ======== التغيير: استخدم mySupabase بدلاً من supabase ========
        const { error } = await mySupabase
          .from('operations')
          .update(updates)
          .eq('id', id);

        if (error) throw error;

        // تحديث البيانات المحلية
        const idx = allData.findIndex(r => r.id == id);
        if (idx !== -1) {
          allData[idx] = { ...allData[idx], ...updates };
        }

        closeModal();
        applyAllFilters();
        alert("✅ تم حفظ التغييرات بنجاح!");
        
      } catch (err) {
        alert("❌ حدث خطأ أثناء الحفظ: " + err.message);
      }
    }

    function closeModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    // ========== تحميل قائمة أرقام بطاقات العملاء الذين لديهم لجان قديمة (لتفعيل/تعطيل الزر) ==========
    async function loadOldCommitteesNidSet() {
      window.oldCommitteesNids = new Set();
      try {
        let page = 0;
        const pageSize = 1000;
        while (true) {
          const { data, error } = await mySupabase
            .from('اللجان_القديمة')
            .select('"رقم بطاقة العميل"')
            .range(page * pageSize, (page + 1) * pageSize - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          data.forEach(r => { if (r["رقم بطاقة العميل"]) window.oldCommitteesNids.add(r["رقم بطاقة العميل"]); });
          if (data.length < pageSize) break;
          page++;
        }
      } catch (e) {
        console.error('تعذر تحميل قائمة اللجان القديمة:', e);
      }
    }

    // ========== فتح السجل التاريخي (اللجان القديمة) للعميل ==========
    function openClientHistory(idx) {
      const row = (window.currentTableData || [])[idx];
      if (!row) {
        alert('تعذر العثور على بيانات هذا السجل.');
        return;
      }
      const nid = row["رقم البطاقة العميل"];
      if (!nid) {
        alert('لا يوجد رقم بطاقة لهذا العميل.');
        return;
      }
      window.open('client-history.html?nid=' + encodeURIComponent(nid), '_blank');
    }

    function exportToExcel() {
      if (!filteredData || filteredData.length === 0) {
        alert('لا توجد بيانات للتصدير!');
        return;
      }

      try {
        const exportBtn = document.getElementById('exportBtn');
        const originalText = exportBtn ? exportBtn.innerHTML : '';
        if (exportBtn) {
          exportBtn.innerHTML = '⏳ جاري التصدير...';
          exportBtn.disabled = true;
        }

        const exportData = filteredData.map((row, idx) => ({
          'م': idx + 1,
          'رقم بطاقة العميل': row["رقم البطاقة العميل"] || '',
          'كود العميل': row["كود_العميل"] || '',
          'اسم العميل': row["اسم_العميل"] || row["اسم_العميل_من_بيانات_القروض"] || row["اسم_العميل_من_التقييم"] || '',
          'المشروع': row["المشروع"] || '',
          'رقم بطاقة الضامن': row["رقم بطاقة الضامن"] || '',
          'اسم الضامن': row["اسم_الضامن"] || '',
          'المبلغ المطلوب': row["المبلغ المطلوب"] || 0,
          'الأخصائي': row["اسم الاخصائى"] || '',
          'تم التحويل': row["تم التحويل"] ? 'نعم' : 'لا',
          'المراجعة الداخلية': row["المراجعة الداخلية"] || '',
          'ملاحظات المراجعة الداخلية': row["ملاحظات المراجعة الداخلية"] || '',
          'مسؤول المتابعة': row["مسؤول المتابعة"] || '',
          'تعليق مسؤول المتابعة': row["تعليق مسؤول المتابعة"] || '',
          'الإدارة': row["الادارة"] || '',
          'ملاحظات الإدارة': row["ملاحظات الادارة"] || '',
          'رقم اللجنة': row["رقم اللجنة"] || '',
          'عدد أيام التأخير': row["عدد ايام التاخير"] || '',
          'عدد الأقساط': row["عدد الاقساط"] || '',
          'المنطقة': row["المنطقه"] || '',
          'الفرع': row["الفرع"] || '',
          'القائم بالزيارة': row["القائم بالزياره"] || '',
          'القائم بالإدخال': row["اسم القائم بالادخال"] || '',
          'تاريخ الإدخال': row["created_at"] ? new Date(row["created_at"]).toLocaleDateString('ar-EG') : ''
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        worksheet['!cols'] = Object.keys(exportData[0] || {}).map(k => ({ wch: Math.max(14, k.length + 4) }));

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'بيانات القروض');

        const statsSheet = XLSX.utils.aoa_to_sheet([
          ['ملخص الإحصائيات'],
          [''],
          ['إجمالي السجلات', filteredData.length],
          ['مجموع المبالغ المطلوبة', filteredData.reduce((sum, row) => sum + (parseFloat(row["المبلغ المطلوب"]) || 0), 0)],
          [''],
          ['تاريخ التصدير', new Date().toLocaleDateString('ar-EG')],
          ['وقت التصدير', new Date().toLocaleTimeString('ar-EG')]
        ]);
        statsSheet['!cols'] = [{ wch: 25 }, { wch: 20 }];
        XLSX.utils.book_append_sheet(workbook, statsSheet, 'ملخص');

        const fileName = `بيانات_القروض_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);

        setTimeout(() => {
          if (exportBtn) {
            exportBtn.innerHTML = originalText;
            exportBtn.disabled = false;
          }
          alert(`تم تصدير ${filteredData.length} سجل بنجاح إلى ملف ${fileName}`);
        }, 400);

      } catch (error) {
        console.error('خطأ في التصدير:', error);
        alert('حدث خطأ أثناء التصدير. يرجى المحاولة مرة أخرى.');
        const exportBtn = document.getElementById('exportBtn');
        if (exportBtn) {
          exportBtn.innerHTML = '📊 تصدير للإكسل';
          exportBtn.disabled = false;
        }
      }
    }

    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target == modal) closeModal();
    };

    // تشغيل التطبيق
    init().catch(err => {
      document.getElementById('tableContainer').innerHTML = `<div class="error">خطأ: ${err.message}</div>`;
      console.error('خطأ:', err);
    });
  </script>
