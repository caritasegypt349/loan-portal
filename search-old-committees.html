<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>البحث في اللجان القديمة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      color: #142433;
    }
    .top-header {
      max-width: 1500px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #b3463a 0%, #1c3f66 100%);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(15, 40, 70, 0.4);
    }
    .top-header .brand { display: flex; align-items: center; gap: 10px; }
    .top-header .brand img { height: 34px; width: auto; filter: drop-shadow(0 2px 6px rgba(15, 40, 70, 0.25)); }
    .top-header .brand span { color: white; font-weight: 800; font-size: 14px; }
    .top-header .nav-actions { display: flex; gap: 10px; }
    .top-header .nav-actions a, .top-header .nav-actions button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background 0.2s ease;
    }
    .top-header .nav-actions a:hover, .top-header .nav-actions button:hover {
      background: rgba(255,255,255,0.28);
    }

    .container {
      max-width: 1500px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #b3463a 0%, #1c3f66 50%, #b3463a 100%);
    }
    h2 { text-align: center; color: #b3463a; font-weight: 800; margin-top: 0; }
    p.desc { text-align: center; color: #64768a; font-size: 13.5px; margin-top: -6px; margin-bottom: 22px; }

    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .search-bar input {
      flex: 1;
      min-width: 260px;
      padding: 13px 16px;
      border: 1.5px solid #dde5ee;
      border-radius: 10px;
      font-size: 15px;
      font-family: 'Tajawal', sans-serif;
    }
    .search-bar input:focus {
      outline: none;
      border-color: #b3463a;
      box-shadow: 0 0 0 3px rgba(179, 70, 58, 0.15);
    }
    .search-bar button {
      padding: 13px 24px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      white-space: nowrap;
    }
    .btn-search { background: linear-gradient(135deg, #b3463a 0%, #1c3f66 100%); color: white; }
    .btn-export { background: #16a085; color: white; }

    .hint { font-size: 12.5px; color: #64768a; margin-bottom: 10px; }

    .result-count { font-size: 14px; font-weight: 700; color: #1c3f66; margin: 15px 0 10px; }

    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; min-width: 900px; }
    th, td { border: 1px solid #eee; padding: 9px 11px; text-align: right; font-size: 12.5px; }
    th { background: #f2f2f2; }
    tr:hover { background: #fafcfb; }
    .match-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 700;
      background: #fef9e7;
      color: #7d6608;
      margin-left: 4px;
    }
    .month-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background: #eef4fa;
      color: #1c3f66;
    }
    .expand-btn {
      background: #b3463a;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }
    .detail-row td { background: #fbfcfe; padding: 15px; font-size: 12.5px; line-height: 1.9; }

    .loading, .no-data, .empty-state { text-align: center; padding: 45px 20px; color: #64768a; }
    .error-box { text-align: center; padding: 30px; color: #e74c3c; font-weight: bold; }
    .denied-box { text-align: center; padding: 60px 20px; color: #b3463a; font-weight: 700; font-size: 16px; }

    @media (max-width: 800px) {
      body { padding: 12px; }
      .container { padding: 16px; }
      .top-header { flex-direction: column; align-items: stretch; gap: 10px; }
      .top-header .brand { justify-content: center; }
      .top-header .nav-actions { justify-content: center; }
      .search-bar { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand">
      <img src="logo.png" alt="Caritas Egypt" />
      <span>نظام إدارة التمويل</span>
    </div>
    <div class="nav-actions">
      <a href="index.html">🏠 الرئيسية</a>
      <button onclick="pageLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div id="accessDenied" class="container" style="display:none;">
    <div class="denied-box">🚫 هذه الصفحة متاحة للمدير فقط.</div>
  </div>

  <div id="mainContainer" class="container" style="display:none;">
    <h2>🔎 البحث في اللجان القديمة</h2>
    <p class="desc">دور بجزء من الاسم، رقم البطاقة، أو كود العميل — البحث بيشمل اسم العميل واسم الضامن مع بعض</p>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="مثال: محمد أحمد، أو 2965، أو كود العميل..." />
      <button class="btn-search" onclick="runSearch()">🔎 بحث</button>
      <button class="btn-export" onclick="exportResults()">📊 تصدير النتائج Excel</button>
    </div>
    <div class="hint">اكتب 3 حروف أو أرقام على الأقل عشان النتائج تكون دقيقة.</div>

    <div id="resultsArea"></div>
  </div>

  <script>
    function pageLogout() {
      if (confirm("هل تريد تسجيل الخروج من النظام؟")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    let db;
    try {
      db = window.supabase.createClient(
        'https://akjyrmmqsnxdbkslxmvb.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFranlybW1xc254ZGJrc2x4bXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODUxODcsImV4cCI6MjA4MDQ2MTE4N30.EuTd_i9fEecFGJG89PhRa3z68k5x6nflOW6fvqvMQJM'
      );
    } catch (err) {
      console.error('فشل في تهيئة قاعدة البيانات:', err);
    }

    let lastResults = [];

    function init() {
      const userId = localStorage.getItem('loggedInUserId');
      if (!userId) {
        alert('الرجاء تسجيل الدخول أولًا!');
        window.location.href = 'index.html';
        return;
      }

      const userRole = localStorage.getItem('userRole');
      if (userRole !== 'admin') {
        document.getElementById('accessDenied').style.display = 'block';
        return;
      }

      document.getElementById('mainContainer').style.display = 'block';

      document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') runSearch();
      });
    }

    async function runSearch() {
      const term = document.getElementById('searchInput').value.trim();
      const resultsArea = document.getElementById('resultsArea');

      if (term.length < 3) {
        resultsArea.innerHTML = '<div class="empty-state">اكتب 3 حروف أو أرقام على الأقل للبحث.</div>';
        lastResults = [];
        return;
      }

      resultsArea.innerHTML = '<div class="loading">جارٍ البحث...</div>';

      try {
        const pattern = `%${term}%`;
        const { data, error } = await db
          .from('اللجان_القديمة')
          .select('*')
          .or(`"اسم العميل".ilike.${pattern},"اسم الضامن".ilike.${pattern},"رقم بطاقة العميل".ilike.${pattern},"رقم بطاقة الضامن".ilike.${pattern},"كود العميل".ilike.${pattern}`)
          .order('الشهر', { ascending: false })
          .limit(500);

        if (error) throw error;

        lastResults = data || [];
        renderResults(lastResults, term);

      } catch (err) {
        console.error('خطأ في البحث:', err);
        resultsArea.innerHTML = `<div class="error-box">❌ حدث خطأ أثناء البحث: ${err.message || err}</div>`;
      }
    }

    function matchReason(row, term) {
      const t = term.toLowerCase();
      const reasons = [];
      if ((row["اسم العميل"] || '').toLowerCase().includes(t)) reasons.push('اسم العميل');
      if ((row["اسم الضامن"] || '').toLowerCase().includes(t)) reasons.push('اسم الضامن');
      if ((row["رقم بطاقة العميل"] || '').includes(term)) reasons.push('رقم بطاقة العميل');
      if ((row["رقم بطاقة الضامن"] || '').includes(term)) reasons.push('رقم بطاقة الضامن');
      if ((row["كود العميل"] || '').includes(term)) reasons.push('كود العميل');
      return reasons;
    }

    function renderResults(data, term) {
      const resultsArea = document.getElementById('resultsArea');

      if (!data || data.length === 0) {
        resultsArea.innerHTML = '<div class="no-data">لا توجد نتائج مطابقة لبحثك.</div>';
        return;
      }

      let html = `<div class="result-count">تم العثور على ${data.length.toLocaleString('ar-EG')} نتيجة</div>`;
      html += `<div class="table-wrapper"><table><thead><tr>
        <th>الشهر</th>
        <th>اسم العميل</th>
        <th>اسم الضامن</th>
        <th>رقم بطاقة العميل</th>
        <th>رقم بطاقة الضامن</th>
        <th>كود العميل</th>
        <th>الفرع</th>
        <th>المبلغ المطلوب</th>
        <th>رقم اللجنة</th>
        <th>مطابقة بسبب</th>
        <th></th>
      </tr></thead><tbody>`;

      data.forEach((row, idx) => {
        const reasons = matchReason(row, term);
        const reasonsHtml = reasons.map(r => `<span class="match-badge">${r}</span>`).join('');

        html += `
          <tr>
            <td><span class="month-badge">${row["الشهر"] || '—'}</span></td>
            <td>${row["اسم العميل"] || '—'}</td>
            <td>${row["اسم الضامن"] || '—'}</td>
            <td style="direction:ltr; text-align:left;">${row["رقم بطاقة العميل"] || '—'}</td>
            <td style="direction:ltr; text-align:left;">${row["رقم بطاقة الضامن"] || '—'}</td>
            <td>${row["كود العميل"] || '—'}</td>
            <td>${row["الفرع"] || '—'}</td>
            <td>${row["المبلغ المطلوب"] || '—'}</td>
            <td>${row["رقم اللجنة"] || '—'}</td>
            <td>${reasonsHtml}</td>
            <td><button class="expand-btn" onclick="toggleDetail(${idx})">تفاصيل</button></td>
          </tr>
          <tr class="detail-row" id="search-detail-${idx}" style="display:none;">
            <td colspan="11">
              المشروع: ${row["المشروع"] || '—'} |
              نظام التمويل: ${row["نظام التمويل"] || '—'} |
              المصاريف الإدارية: ${row["المصاريف الإدارية"] || '—'} |
              الأخصائي: ${row["الأخصائي"] || '—'} |
              تم التحويل: ${row["تم التحويل"] || '—'}<br>
              المراجعة الداخلية: ${row["المراجعة الداخلية"] || '—'} |
              مسؤول المتابعة: ${row["مسؤول المتابعة"] || '—'} |
              الإدارة: ${row["الإدارة"] || '—'}<br>
              عدد أيام التأخير: ${row["عدد أيام التأخير"] || '—'} |
              عدد الأقساط: ${row["عدد الأقساط"] || '—'} |
              المنطقة: ${row["المنطقة"] || '—'}<br>
              القائم بالزيارة: ${row["القائم بالزيارة"] || '—'} |
              القائم بالإدخال: ${row["القائم بالإدخال"] || '—'} |
              تاريخ الإدخال: ${row["تاريخ الإدخال"] || '—'}
            </td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
      resultsArea.innerHTML = html;
    }

    function toggleDetail(idx) {
      const row = document.getElementById('search-detail-' + idx);
      if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
    }

    function exportResults() {
      if (!lastResults || lastResults.length === 0) {
        alert('لا توجد نتائج لتصديرها. نفّذ بحث أولًا.');
        return;
      }

      try {
        const exportData = lastResults.map((r, idx) => ({
          'م': idx + 1,
          'الشهر': r["الشهر"] || '',
          'اسم العميل': r["اسم العميل"] || '',
          'اسم الضامن': r["اسم الضامن"] || '',
          'رقم بطاقة العميل': r["رقم بطاقة العميل"] || '',
          'رقم بطاقة الضامن': r["رقم بطاقة الضامن"] || '',
          'كود العميل': r["كود العميل"] || '',
          'الفرع': r["الفرع"] || '',
          'المشروع': r["المشروع"] || '',
          'المبلغ المطلوب': r["المبلغ المطلوب"] || '',
          'رقم اللجنة': r["رقم اللجنة"] || '',
          'الأخصائي': r["الأخصائي"] || '',
          'تم التحويل': r["تم التحويل"] || '',
          'المراجعة الداخلية': r["المراجعة الداخلية"] || '',
          'مسؤول المتابعة': r["مسؤول المتابعة"] || '',
          'الإدارة': r["الإدارة"] || ''
        }));

        const worksheet = XLSX.utils.json_to_sheet(exportData);
        worksheet['!cols'] = Object.keys(exportData[0] || {}).map(k => ({ wch: Math.max(14, k.length + 4) }));

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'نتائج البحث');

        const fileName = `بحث_اللجان_القديمة_${new Date().toISOString().slice(0, 10)}.xlsx`;
        XLSX.writeFile(workbook, fileName);
      } catch (err) {
        console.error('خطأ في التصدير:', err);
        alert('حدث خطأ أثناء التصدير.');
      }
    }

    init();
  </script>
</body>
</html>
