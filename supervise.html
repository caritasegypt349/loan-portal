<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>متابعة العمليات - نظام القروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { 
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; 
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0; 
      padding: 20px; 
      min-height: 100vh;
    }
    .top-header {
      max-width: 1900px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #d35400 0%, #1c3f66 100%);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(15, 40, 70, 0.4);
    }
    .top-header .brand { display: flex; align-items: center; gap: 10px; }
    .top-header .brand img { height: 34px; width: auto; filter: drop-shadow(0 2px 6px rgba(15, 40, 70, 0.25)); }
    .top-header .brand span { color: white; font-weight: 800; font-size: 14px; }
    .top-header .nav-actions { display: flex; gap: 10px; }
    .top-header .nav-actions a, .top-header .nav-actions button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background 0.2s ease;
    }
    .top-header .nav-actions a:hover, .top-header .nav-actions button:hover {
      background: rgba(255,255,255,0.28);
    }
    .container { 
      max-width: 1900px; 
      margin: 0 auto; 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #e67e22 0%, #1c3f66 50%, #e67e22 100%);
    }
    h2 { 
      text-align: center; 
      color: #d35400; 
      margin-top: 0; 
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 10px;
    }
    .stats { 
      display: flex; 
      gap: 20px; 
      justify-content: center; 
      margin-bottom: 20px; 
    }
    .stat-card { 
      background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); 
      color: white; 
      padding: 15px 30px; 
      border-radius: 8px; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(230, 126, 34, 0.4); 
      transition: transform 0.3s; 
    }
    .stat-card:hover { 
      transform: translateY(-5px); 
    }
    .stat-card .label { 
      font-size: 14px; 
      opacity: 0.9; 
    }
    .stat-card .value { 
      font-size: 24px; 
      font-weight: bold; 
      margin-top: 5px; 
    }
    .filters { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
      margin: 20px 0; 
      padding: 15px;
      background: #fef5e7;
      border-radius: 8px;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filter-label {
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 2px;
    }
    select, input { 
      width: 100%; 
      padding: 10px; 
      border: 2px solid #fdebd0; 
      border-radius: 6px; 
      transition: all 0.3s; 
      font-size: 14px;
    }
    select:focus, input:focus { 
      outline: none; 
      border-color: #e67e22; 
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1); 
    }
    .committee-filter {
      position: relative;
      grid-column: span 2;
    }
    .committee-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border: 2px solid #e67e22;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      width: 100%;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .committee-dropdown.show {
      display: block;
    }
    .committee-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .committee-item:hover {
      background: #fef9e7;
    }
    .committee-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .committee-toggle {
      padding: 10px;
      border: 2px solid #fdebd0;
      border-radius: 6px;
      cursor: pointer;
      background: white;
      text-align: right;
    }
    .committee-toggle:hover {
      border-color: #e67e22;
    }
    .selected-committees {
      font-size: 12px;
      color: #e67e22;
      margin-top: 4px;
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.3s;
    }
    button:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(52, 152, 219, 0.4); 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td { 
      border: 1px solid #fdebd0; 
      padding: 12px 8px; 
      text-align: right; 
      font-size: 13px; 
    }
    th { 
      background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); 
      color: white; 
      position: sticky; 
      top: 0; 
      z-index: 10;
      font-weight: bold;
    }
    th input, th select { 
      width: 95%; 
      padding: 6px; 
      margin-top: 8px; 
      border: 1px solid #fff; 
      border-radius: 4px; 
      font-size: 12px; 
      background: rgba(255,255,255,0.95); 
    }
    tr:nth-child(even) { 
      background-color: #fef5e7; 
    }
    tr:hover:not(.detail-row) { 
      background-color: #fdebd0; 
      transition: background-color 0.3s; 
    }
    .edit-btn { 
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      margin: 2px;
      font-weight: bold;
      transition: all 0.3s;
      width: auto;
    }
    .edit-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
    }
    .expand-btn { 
      background: linear-gradient(135deg, #e67e22 0%, #d35400 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.3s; 
      font-weight: bold; 
      margin: 2px;
    }
    .expand-btn:hover { 
      transform: scale(1.1); 
      box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4); 
    }
    .loading { 
      text-align: center; 
      padding: 40px; 
      color: #e67e22; 
      font-size: 18px;
    }
    .error { 
      color: #e74c3c; 
      text-align: center; 
      padding: 20px; 
      font-size: 16px;
    }
    
    /* تنسيقات التفاصيل الجديدة مثل view-only */
    .detail-row { 
      display: none; 
      background: #fef5e7; 
    }
    .detail-row td { 
      padding: 20px; 
      line-height: 1.8;
    }
    .detail-container {
        padding: 10px;
    }
    .detail-row-sections {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px dashed #f8c471;
    }
    .detail-section h3 {
        color: #e67e22;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #e67e22;
        padding-bottom: 5px;
    }
    .detail-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .detail-label {
        font-weight: bold;
        color: #2c3e50;
        flex-basis: 50%;
        text-align: right;
        padding-left: 10px;
    }
    .detail-value {
        flex-basis: 50%;
        text-align: left;
        color: #555;
    }
    .detail-section-full h3 {
        color: #d35400;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #d35400;
        padding-bottom: 5px;
    }
    
    /* Modal Styles */
    .modal { 
      display: none; 
      position: fixed; 
      z-index: 1000; 
      left: 0; 
      top: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.6); 
      overflow-y: auto;
      padding: 20px 0;
    }
    .modal-content { 
      background: white; 
      margin: 10% auto; 
      padding: 30px; 
      width: 90%;
      max-width: 550px;
      border-radius: 12px; 
      max-height: 85vh; 
      overflow-y: auto;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    .modal-content h3 {
      color: #e67e22;
      text-align: center;
      margin-bottom: 25px;
      font-size: 24px;
      border-bottom: 3px solid #e67e22;
      padding-bottom: 10px;
    }
    .modal label { 
      display: block; 
      margin: 12px 0 5px; 
      font-weight: bold;
      color: #2c3e50;
      font-size: 14px;
    }
    .modal input, .modal textarea, .modal select { 
      width: 100%; 
      padding: 10px; 
      margin-bottom: 15px;
      border: 2px solid #fdebd0;
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.3s;
      box-sizing: border-box;
    }
    .modal input:focus, .modal textarea:focus, .modal select:focus {
      border-color: #e67e22;
      box-shadow: 0 0 0 3px rgba(230, 126, 34, 0.1);
      outline: none;
    }
    .modal button { 
      width: auto; 
      margin: 10px 5px 0; 
      padding: 12px 30px;
      font-size: 16px;
    }
    .modal .btn-save {
      background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
    }
    .modal .btn-close {
      background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
    }
    .modal .button-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #fdebd0;
    }
    
    /* ألوان المقبول والمرفوض */
    .approved-cell {
      background-color: #e6ffe6;
      color: #008000;
      font-weight: bold;
    }
    .rejected-cell {
      background-color: #ffe6e6;
      color: #cc0000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand">
      <img src="logo.png" alt="Caritas Egypt" />
      <span>نظام إدارة التمويل</span>
    </div>
    <div class="nav-actions">
      <a href="index.html">🏠 الرئيسية</a>
      <button onclick="pageLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="container">
    <h2>متابعة العمليات</h2>

    <div class="stats">
      <div class="stat-card">
        <div class="label">إجمالي السجلات</div>
        <div class="value" id="totalRecords">0</div>
      </div>
      <div class="stat-card">
        <div class="label">مجموع المبالغ</div>
        <div class="value" id="totalAmount">0</div>
      </div>
    </div>

    <div class="filters" id="filters">
      <div class="filter-group">
        <label class="filter-label">الفرع</label>
        <select id="filterBranch">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">المراجعة الداخلية</label>
        <select id="filterReview">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">مسؤول المتابعة</label>
        <select id="filterSupervisor">
          <option value="">الكل</option>
         <optgroup label="📝 تحت الإجراء والمراجعة">
        <option value="لم تتم المراجعة">لم تتم المراجعة</option>
        <option value="تحت المراجعة للنقاش">تحت المراجعة للنقاش</option>
        <option value="تحت العرض والمناقشة">تحت العرض والمناقشة</option>
        <option value="مرسل ميل بالملاحظات فى انتظار الرد">مرسل ميل بالملاحظات فى انتظار الرد</option>
        <option value="مطلوب ارسال الملف على الميل">مطلوب ارسال الملف على الميل</option>
        <option value="يرجى استكمال باقى الملاحظات للمراجعة والموافقة">يرجى استكمال باقى الملاحظات الموجودة لاتمام عمليه المراجعة و الموافقه</option>
        <option value="موقع لاستكمال الموافقة علي تمويل العميل">الموقع لاستكمال الموافقة علي تمويل العميل</option>
    </optgroup>

    <optgroup label="💬 تعليقات ومتطلبات إضافية">
        <option value="هناك تعليق تحت مراجعة التعليقات">هناك تعليق تحت مراجعة التعليقات</option>
        <option value="مناقشه المبلغ">مناقشه المبلغ</option>
        <option value="مطلوب تغيير الضامن">مطلوب تغيير الضامن</option>
        <option value="مطلوب عمل استثناء الـ iScore">مطلوب عمل استثناء الـ iScore</option>
    </optgroup>

    <optgroup label="✅ الموافقات والقبول">
        <option value="تحت العرض لاخذ الموافقة النهائية">تحت العرض لاخذ الموافقة النهائية</option>
        <option value="تمت المراجعة مقبول">تمت المراجعة مقبول</option>
        <option value="تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة">تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة</option>
        <option value="سداد معجل">سداد معجل</option>
    </optgroup>

    <optgroup label="❌ حالات الرفض والإلغاء">
        <option value="تمت المراجعة مرفوض">تمت المراجعة مرفوض</option>
        <option value="مرفوض من اداره الائتمان">مرفوض من اداره الائتمان</option>
        <option value="عدد القروض الموجودة للعميل أكبر من الحد المسموح به">عدد القروض الموجودة للعميل أكبر من الحد المسموح به (Exceeded Limit)</option>
        <option value="تاريخ الاستعلام قديم. يرجى عمل استعلام جديد">تاريخ الاستعلام الخاص بالعميل قديم. يرجى عمل استعلام جديد، حيث لا يعتد بالاستعلام الحالي</option>
        <option value="تم الغاء الطلب من العميل">تم الغاء الطلب من العميل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">الإدارة</label>
        <select id="filterAdmin">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">اسم الأخصائي</label>
        <select id="filterOfficer">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">تم التحويل</label>
        <select id="filterTransferred">
          <option value="">الكل</option>
          <option value="true">نعم</option>
          <option value="false">لا</option>
        </select>
      </div>
      
      <div class="filter-group committee-filter">
        <label class="filter-label">رقم اللجنة</label>
        <div class="committee-toggle" onclick="toggleCommitteeDropdown()">
          <span>اختر اللجان</span>
          <div class="selected-committees" id="selectedCommitteesText"></div>
        </div>
        <div class="committee-dropdown" id="committeeDropdown"></div>
      </div>
      
      <button onclick="resetFilters()" class="btn-apply" style="grid-column: span 2;">إعادة تعيين الفلاتر</button>
    </div>

    <div class="table-wrapper">
      <div id="tableContainer">
        <div class="loading">جاري تحميل البيانات...</div>
      </div>
    </div>
  </div>

  <div id="editModal" class="modal">
    <div class="modal-content">
      <h3>تعديل متابعة العملية</h3>
      <input type="hidden" id="editRecordId" />
      <label>حالة المتابعة</label>
      <select id="editSupervisorStatus">
        <optgroup label="📝 تحت الإجراء والمراجعة">
        <option value="لم تتم المراجعة">لم تتم المراجعة</option>
        <option value="تحت المراجعة للنقاش">تحت المراجعة للنقاش</option>
        <option value="تحت العرض والمناقشة">تحت العرض والمناقشة</option>
        <option value="مرسل ميل بالملاحظات فى انتظار الرد">مرسل ميل بالملاحظات فى انتظار الرد</option>
        <option value="مطلوب ارسال الملف على الميل">مطلوب ارسال الملف على الميل</option>
        <option value="يرجى استكمال باقى الملاحظات للمراجعة والموافقة">يرجى استكمال باقى الملاحظات الموجودة لاتمام عمليه المراجعة و الموافقه</option>
        <option value="موقع لاستكمال الموافقة علي تمويل العميل">الموقع لاستكمال الموافقة علي تمويل العميل</option>
    </optgroup>

    <optgroup label="💬 تعليقات ومتطلبات إضافية">
        <option value="هناك تعليق تحت مراجعة التعليقات">هناك تعليق تحت مراجعة التعليقات</option>
        <option value="مناقشه المبلغ">مناقشه المبلغ</option>
        <option value="مطلوب تغيير الضامن">مطلوب تغيير الضامن</option>
        <option value="مطلوب عمل استثناء الـ iScore">مطلوب عمل استثناء الـ iScore</option>
    </optgroup>

    <optgroup label="✅ الموافقات والقبول">
        <option value="تحت العرض لاخذ الموافقة النهائية">تحت العرض لاخذ الموافقة النهائية</option>
        <option value="تمت المراجعة مقبول">تمت المراجعة مقبول</option>
        <option value="تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة">تمت الموافقة على التمويل، وتم تعديل المبلغ/المدة</option>
        <option value="سداد معجل">سداد معجل</option>
    </optgroup>

    <optgroup label="❌ حالات الرفض والإلغاء">
        <option value="تمت المراجعة مرفوض">تمت المراجعة مرفوض</option>
        <option value="مرفوض من اداره الائتمان">مرفوض من اداره الائتمان</option>
        <option value="عدد القروض الموجودة للعميل أكبر من الحد المسموح به">عدد القروض الموجودة للعميل أكبر من الحد المسموح به (Exceeded Limit)</option>
        <option value="تاريخ الاستعلام قديم. يرجى عمل استعلام جديد">تاريخ الاستعلام الخاص بالعميل قديم. يرجى عمل استعلام جديد، حيث لا يعتد بالاستعلام الحالي</option>
        <option value="تم الغاء الطلب من العميل">تم الغاء الطلب من العميل</option>
      </select>
      <label>تعليق مسؤول المتابعة</label>
      <textarea id="editSupervisorComment" rows="3"></textarea>
      <div class="button-group">
        <button onclick="saveSupervise()" class="btn-save">حفظ</button>
        <button onclick="closeModal()" class="btn-close">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    function pageLogout() {
      if (confirm("هل تريد تسجيل الخروج من النظام؟")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    // التحقق من الجلسة أولاً
    function validateSession() {
      const userId = localStorage.getItem('loggedInUserId');
      const userFullName = localStorage.getItem('loggedInUser');
      
      if (!userId || !userFullName) {
        alert("الرجاء تسجيل الدخول أولًا!");
        window.location.href = "index.html";
        return false;
      }
      
      return true;
    }

      const text = document.getElementById('selectedCommitteesText');
      if (text) {

          text.textContent = `تم اختيار ${selectedCommittees.length} لجنة`;

    function applyAllFilters() {
      try {
        const branch = document.getElementById('filterBranch')?.value || '';
        const review = document.getElementById('filterReview')?.value || '';
        const supervisor = document.getElementById('filterSupervisor')?.value || '';
        const admin = document.getElementById('filterAdmin')?.value || '';
        const officer = document.getElementById('filterOfficer')?.value || '';
        const transferred = document.getElementById('filterTransferred')?.value || '';

        filteredData = allData.filter(row => {
          // الفلاتر العامة
          if (branch && row["الفرع"] !== branch) return false;
          if (review && row["المراجعة الداخلية"] !== review) return false;
          if (supervisor && row["مسؤول المتابعة"] !== supervisor) return false;
          if (admin && row["الادارة"] !== admin) return false;
          if (officer && row["اسم الاخصائى"] !== officer) return false;
          if (transferred !== '') {
            const isTransferred = row["تم التحويل"] === true;
            if (transferred === 'true' && !isTransferred) return false;
            if (transferred === 'false' && isTransferred) return false;
          }
          
          // فلتر اللجان (multi-select)
          if (selectedCommittees.length > 0) {
            if (!selectedCommittees.includes(row["رقم اللجنة"])) return false;
          }

          // فلاتر الأعمدة
          if (columnFilters.nationalId && !row["رقم البطاقة العميل"]?.toLowerCase().includes(columnFilters.nationalId)) return false;
          if (columnFilters.clientId && !row["كود_العميل"]?.toLowerCase().includes(columnFilters.clientId)) return false;
          if (columnFilters.clientName) {
            const name1 = row["اسم_العميل"]?.toLowerCase() || '';
            const name2 = row["اسم_العميل_من_التقييم"]?.toLowerCase() || '';
            if (!name1.includes(columnFilters.clientName) && !name2.includes(columnFilters.clientName)) return false;
          }
          if (columnFilters.project && !row["المشروع"]?.toLowerCase().includes(columnFilters.project)) return false;
          if (columnFilters.guarantorId && !row["رقم بطاقة الضامن"]?.toLowerCase().includes(columnFilters.guarantorId)) return false;
          if (columnFilters.guarantorName && !row["اسم_الضامن"]?.toLowerCase().includes(columnFilters.guarantorName)) return false;

          return true;
        });

        renderTable(filteredData);
        updateStats(filteredData);
      } catch (err) {
        console.error('خطأ في applyAllFilters:', err);
      }
    }

    function updateColumnFilter(field, value) {

    function searchOnEnter(event, field, value) {

        applyAllFilters();
      }
    }

                        <span class="detail-value">${row["ملاحظات المراجعة الداخلية"] || '—'}</span>
                      </div>
                    </div>
                    <div>
                      <div class="detail-item">
                        <span class="detail-label">مسؤول المتابعة:</span>
                        <span class="detail-value">${row["مسؤول المتابعة"] || '—'}</span>
                      </div>
                      <div class="detail-item">
                        <span class="detail-label">تعليق المتابعة:</span>
                        <span class="detail-value">${row["تعليق مسؤول المتابعة"] || '—'}</span>
                      </div>
                    </div>
                    <div>
                      <div class="detail-item">
                        <span class="detail-label">الإدارة:</span>
                        <span class="detail-value">${row["الادارة"] || '—'}</span>
                      </div>
                      <div class="detail-item">
                        <span class="detail-label">ملاحظات الإدارة:</span>
                        <span class="detail-value">${row["ملاحظات الادارة"] || '—'}</span>
                      </div>
                      <div class="detail-item">
                        <span class="detail-label">تم التحويل:</span>
                        <span class="detail-value">${row["تم التحويل"] ? '<span style="color: #27ae60;">✓ نعم</span>' : '<span style="color: #e74c3c;">✗ لا</span>'}</span>
                      </div>
                    </div>
                  </div>
                </div>

              </div>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    function toggleDetail(index, event) {
      const detailRow = document.getElementById(`detail-${index}`);
      const btn = event.target;
      if (detailRow && btn) {
        if (detailRow.style.display === 'none' || !detailRow.style.display) {
          detailRow.style.display = 'table-row';
          btn.textContent = 'إخفاء';
          btn.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
        } else {
          detailRow.style.display = 'none';
          btn.textContent = 'تفاصيل';
          btn.style.background = 'linear-gradient(135deg, #e67e22 0%, #d35400 100%)';
        }
      }
    }

    function openEditModal(recordId) {
      const record = allData.find(r => r.id == recordId);
      if (!record) return;

      const recordIdInput = document.getElementById('editRecordId');
      const statusSelect = document.getElementById('editSupervisorStatus');
      const commentTextarea = document.getElementById('editSupervisorComment');
      const modal = document.getElementById('editModal');

      if (recordIdInput) recordIdInput.value = record.id;
      if (statusSelect) statusSelect.value = record["مسؤول المتابعة"] || 'لم تتم المراجعة';
      if (commentTextarea) commentTextarea.value = record["تعليق مسؤول المتابعة"] || '';
      if (modal) modal.style.display = 'block';
    }

    async function saveSupervise() {
      const idValue = document.getElementById('editRecordId')?.value;
      const id = parseInt(idValue);
      
      if (isNaN(id) || !idValue) {
        alert("خطأ: لم تم تحديد السجل بشكل صحيح");
        return;
      }

      const updates = {
        "مسؤول المتابعة": document.getElementById('editSupervisorStatus')?.value || 'لم تتم المراجعة',
        "تعليق مسؤول المتابعة": document.getElementById('editSupervisorComment')?.value.trim() || null
      };

      const { error } = await db
        .from('operations')
        .update(updates)
        .eq('id', id);

      if (error) {
        alert("حدث خطأ أثناء الحفظ: " + error.message);
        return;
      }

      // تحديث البيانات المحلية
      const idx = allData.findIndex(r => r.id == id);
      if (idx !== -1) {
        allData[idx] = { ...allData[idx], ...updates };
      }

      closeModal();
      applyAllFilters();
      alert("تم الحفظ بنجاح!");
    }

    function closeModal() {
      const modal = document.getElementById('editModal');
      if (modal) {
        modal.style.display = 'none';
      }
    }

    window.onclick = function(event) {
      const modal = document.getElementById('editModal');
      if (event.target == modal) closeModal();
    };

    // بدء التطبيق
    document.addEventListener('DOMContentLoaded', function() {
      init().catch(err => {
        console.error('خطأ في بدء التطبيق:', err);
        showError(`خطأ في تحميل التطبيق: ${err.message || 'حدث خطأ غير معروف'}`);
      });
    });
  </script>
</body>
</html>
