<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>عرض البيانات التفصيلي - نظام القروض</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- مكتبة SheetJS لتصدير Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    .top-header {
      max-width: 1900px;
      margin: 0 auto 18px;
      background: linear-gradient(135deg, #6a5a9c 0%, #1c3f66 100%);
      border-radius: 14px;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px -10px rgba(15, 40, 70, 0.4);
    }
    .top-header .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-header .brand img {
      height: 34px;
      width: auto;
      filter: drop-shadow(0 2px 6px rgba(15, 40, 70, 0.25));
    }
    .top-header .brand span {
      color: white;
      font-weight: 800;
      font-size: 14px;
    }
    .top-header .nav-actions {
      display: flex;
      gap: 10px;
    }
    .top-header .nav-actions a,
    .top-header .nav-actions button {
      background: rgba(255,255,255,0.15);
      color: white;
      border: 1px solid rgba(255,255,255,0.35);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: background 0.2s ease;
    }
    .top-header .nav-actions a:hover,
    .top-header .nav-actions button:hover {
      background: rgba(255,255,255,0.28);
    }
    body { 
      font-family: 'Segoe UI', Tahoma, sans-serif; 
      background:
        radial-gradient(60% 50% at 10% 5%, rgba(46, 92, 138, 0.18), transparent 60%),
        radial-gradient(55% 45% at 95% 95%, rgba(15, 40, 70, 0.16), transparent 60%),
        linear-gradient(160deg, #eef4fa 0%, #d9e6f4 100%);
      background-attachment: fixed;
      margin: 0; 
      padding: 20px; 
      min-height: 100vh;
      font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif;
    }
    .container { 
      max-width: 1900px; 
      margin: 0 auto; 
      background: white; 
      padding: 25px; 
      border-radius: 12px; 
      box-shadow: 0 10px 40px rgba(15, 40, 70, 0.18);
      position: relative;
      overflow: hidden;
    }
    .container::before {
      content: "";
      position: absolute;
      top: 0; right: 0; left: 0;
      height: 4px;
      background: linear-gradient(90deg, #6a5a9c 0%, #c6a35f 50%, #6a5a9c 100%);
    }
    h2 { 
      text-align: center; 
      color: #142433; 
      margin-top: 0; 
      font-size: 26px; 
      font-weight: 800;
      margin-bottom: 10px; 
    }
    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .export-btn {
      background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(39, 174, 96, 0.4);
      background: linear-gradient(135deg, #229954 0%, #1e8449 100%);
    }
    .export-btn:disabled {
      background: #95a5a6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .stats { 
      display: flex; 
      gap: 20px; 
      justify-content: center; 
      margin-bottom: 20px; 
      flex-wrap: wrap; 
    }
    .stat-card { 
      background: linear-gradient(135deg, #1c3f66 0%, #0f2846 100%); 
      color: white; 
      padding: 15px 30px; 
      border-radius: 8px; 
      text-align: center; 
      box-shadow: 0 4px 15px rgba(15, 40, 70, 0.32); 
      transition: transform 0.3s; 
      flex: 1; 
      min-width: 180px; 
      max-width: 220px; 
    }
    .stat-card:hover { 
      transform: translateY(-5px); 
    }
    .stat-card .label { 
      font-size: 14px; 
      opacity: 0.9; 
    }
    .stat-card .value { 
      font-size: 24px; 
      font-weight: bold; 
      margin-top: 5px; 
    }
    .filters { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
      gap: 15px; 
      margin: 20px 0; 
      padding: 15px; 
      background: #f8f9fa; 
      border-radius: 8px; 
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .filter-label {
      font-size: 13px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 2px;
    }
    select, input { 
      width: 100%; 
      padding: 10px; 
      border: 2px solid #e0e0e0; 
      border-radius: 6px; 
      transition: all 0.3s; 
      font-size: 14px; 
    }
    select:focus, input:focus { 
      outline: none; 
      border-color: #2e5c8a; 
      box-shadow: 0 0 0 3px rgba(86, 134, 179, 0.18); 
    }
    .committee-filter {
      position: relative;
      grid-column: span 2;
    }
    .committee-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border: 2px solid #2e5c8a;
      border-radius: 6px;
      max-height: 300px;
      overflow-y: auto;
      width: 100%;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .committee-dropdown.show {
      display: block;
    }
    .committee-item {
      padding: 8px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .committee-item:hover {
      background: #f0f4f8;
    }
    .committee-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .committee-toggle {
      padding: 10px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      background: white;
      text-align: right;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .committee-toggle:hover {
      border-color: #2e5c8a;
    }
    .committee-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
      padding: 0 12px;
      padding-top: 8px;
      border-bottom: 1px solid #eee;
      padding-bottom: 8px;
    }
    .committee-btn {
      background: #2e5c8a;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      min-width: 120px;
    }
    .committee-btn:hover {
      background: #0f2846;
    }
    .committee-btn.select-all {
      background: #2ecc71;
    }
    .committee-btn.select-committees {
      background: #3498db;
    }
    .committee-btn.clear {
      background: #e74c3c;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin-top: 20px; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.1); 
    }
    th, td { 
      border: 1px solid #e0e0e0; 
      padding: 12px 8px; 
      text-align: right; 
      font-size: 13px; 
    }
    th { 
      background: linear-gradient(135deg, #1c3f66 0%, #0f2846 100%); 
      color: white; 
      position: sticky; 
      top: 0; 
      z-index: 10; 
    }
    th input, th select { 
      width: 95%; 
      padding: 6px; 
      margin-top: 8px; 
      border: 1px solid #fff; 
      border-radius: 4px; 
      font-size: 12px; 
      background: rgba(255,255,255,0.95); 
    }
    tr:nth-child(even) { 
      background-color: #f8f9fa; 
    }
    tr:hover:not(.detail-row) { 
      background-color: #e3f2fd; 
      transition: background-color 0.3s; 
    }
    .expand-btn { 
      background: linear-gradient(135deg, #1c3f66 0%, #0f2846 100%); 
      color: white; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      transition: all 0.3s; 
      font-weight: bold; 
    }
    .actions-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 150px;
    }
    .actions-cell button {
      width: 100%;
      margin: 0;
      white-space: nowrap;
    }
    .expand-btn:hover { 
      transform: scale(1.1); 
      box-shadow: 0 4px 12px rgba(15, 40, 70, 0.32); 
    }
    .kyc-btn {
      background: linear-gradient(135deg, #c6a35f 0%, #a3813f 100%);
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      font-size: 11px;
      white-space: nowrap;
    }
    .kyc-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(166, 130, 63, 0.4);
    }
    .history-btn {
      background: linear-gradient(135deg, #a3813f 0%, #6b5628 100%);
      color: white;
      border: none;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      font-size: 10px;
      white-space: nowrap;
    }
    .history-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 4px 12px rgba(107, 86, 40, 0.4);
    }
    .history-btn.disabled {
      background: #e8e8e8;
      color: #aaa;
      cursor: not-allowed;
    }
    .history-btn.disabled:hover {
      transform: none;
      box-shadow: none;
    }
    .detail-row { 
      display: none; 
      background: #f0f4f8; 
    }
    .detail-row td { 
      padding: 20px; 
      line-height: 1.8; 
    }
    .loading { 
      text-align: center; 
      padding: 40px; 
      color: #777; 
    }
    .error { 
      color: #e74c3c; 
      text-align: center; 
      padding: 20px; 
    }
    .btn-apply { 
      grid-column: span 2; 
      padding: 12px; 
      background: linear-gradient(135deg, #1c3f66 0%, #0f2846 100%); 
      color: white; 
      border: none; 
      border-radius: 6px; 
      font-size: 16px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.3s; 
    }
    .btn-apply:hover { 
      transform: translateY(-2px); 
      box-shadow: 0 6px 20px rgba(15, 40, 70, 0.32); 
    }
    .selected-committees {
      font-size: 12px;
      color: #2e5c8a;
      margin-top: 4px;
      text-align: right;
    }
    .approved-cell {
      background-color: #e6ffe6; 
      color: #008000; 
      font-weight: bold;
    }
    .rejected-cell {
      background-color: #ffe6e6; 
      color: #cc0000; 
      font-weight: bold;
    }
    .detail-container {
        padding: 10px;
    }
    .detail-row-sections {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px dashed #d0d0d0;
    }
    .detail-section h3 {
        color: #0f2846;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #0f2846;
        padding-bottom: 5px;
    }
    .detail-item {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        font-size: 13px;
    }
    .detail-label {
        font-weight: bold;
        color: #2c3e50;
        flex-basis: 50%;
        text-align: right;
        padding-left: 10px;
    }
    .detail-value {
        flex-basis: 50%;
        text-align: left;
        color: #555;
    }
    .detail-section-full h3 {
        color: #2ecc71;
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 15px;
        border-bottom: 2px solid #2ecc71;
        padding-bottom: 5px;
    }
  
    /* ========== تجاوب الشاشة (Responsive) ========== */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      max-width: 100%;
      border-radius: 8px;
    }
    .table-wrapper table {
      min-width: 900px;
    }

    @media (max-width: 900px) {
      body { padding: 12px; }
      .container { padding: 15px; }
      .top-header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 12px 16px;
      }
      .top-header .brand { justify-content: center; }
      .top-header .nav-actions { justify-content: center; }
      .filters {
        grid-template-columns: 1fr 1fr;
        padding: 10px;
        gap: 10px;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr) !important;
      }
      table th, table td {
        padding: 6px 8px !important;
        font-size: 12px !important;
      }
      .modal-content {
        width: 95% !important;
        padding-left: 15px !important;
        padding-right: 15px !important;
        margin: 3% auto !important;
      }
      .form-grid, .details-grid, .comparison-grid {
        grid-template-columns: 1fr !important;
      }
    }

    @media (max-width: 520px) {
      .filters { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr 1fr !important; }
      h2 { font-size: 20px !important; }
      .top-header .brand span { font-size: 12px; }
      .top-header .nav-actions a, .top-header .nav-actions button {
        padding: 7px 12px;
        font-size: 12px;
      }
    }

  </style>
</head>
<body>
  <div class="top-header">
    <div class="brand">
      <img src="logo.png" alt="Caritas Egypt" />
      <span>نظام إدارة التمويل</span>
    </div>
    <div class="nav-actions">
      <a href="index.html">🏠 الرئيسية</a>
      <button onclick="pageLogout()">تسجيل خروج</button>
    </div>
  </div>

  <div class="container">
    <div class="header-controls">
      <h2>عرض البيانات التفصيلي</h2>
      <button class="export-btn" id="exportBtn" onclick="exportToExcel()" disabled>
        <span>📥</span> تصدير البيانات إلى Excel
      </button>
    </div>
    <div id="notifBanner"></div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">إجمالي السجلات</div>
        <div class="value" id="totalRecords">0</div>
      </div>
      <div class="stat-card">
        <div class="label">المبلغ المطلوب</div>
        <div class="value" id="totalAmount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">المبلغ المحول</div>
        <div class="value" id="totalTransferred">0</div>
      </div>
      <div class="stat-card">
        <div class="label">قيمة التمويل</div>
        <div class="value" id="totalFinance">0</div>
      </div>
      <div class="stat-card">
        <div class="label">المصاريف الإدارية</div>
        <div class="value" id="totalAdminFees">0</div>
      </div>
    </div>

    <div class="filters" id="filters">
      <div class="filter-group">
        <label class="filter-label">الفرع</label>
        <select id="filterBranch">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">المراجعة الداخلية</label>
        <select id="filterReview">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">مسؤول المتابعة</label>
        <select id="filterSupervisor">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">الإدارة</label>
        <select id="filterAdmin">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">اسم الأخصائي</label>
        <select id="filterOfficer">
          <option value="">الكل</option>
        </select>
      </div>
      
      <div class="filter-group">
        <label class="filter-label">تم التحويل</label>
        <select id="filterTransferred">
          <option value="">الكل</option>
          <option value="true">نعم</option>
          <option value="false">لا</option>
        </select>
      </div>
      
      <div class="filter-group committee-filter">
        <label class="filter-label">رقم اللجنة</label>
        <div class="committee-toggle" onclick="toggleCommitteeDropdown()">
          <span>اختر اللجان</span>
        </div>
        <div class="selected-committees" id="selectedCommitteesText"></div>
        <div class="committee-dropdown" id="committeeDropdown"></div>
      </div>
      
      <button onclick="resetFilters()" class="btn-apply">إعادة تعيين الفلاتر</button>
    </div>

    <div class="table-wrapper">
      <div id="tableContainer">
        <div class="loading" id="loadingMessage">جاري تحميل البيانات...</div>
      </div>
    </div>
  </div>

  <script>
    function pageLogout() {
      if (confirm("هل تريد تسجيل الخروج من النظام؟")) {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "index.html";
      }
    }

    function validateSession() {
      const userId = localStorage.getItem('loggedInUserId');
      const userFullName = localStorage.getItem('loggedInUser');
      
      if (!userId || !userFullName) {
        alert("الرجاء تسجيل الدخول أولًا!");
        window.location.href = "index.html";
        return false;
      }
      
      return true;
    }

    let db;
    try {
      db = window.supabase.createClient(
        'https://akjyrmmqsnxdbkslxmvb.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFranlybW1xc254ZGJrc2x4bXZiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODUxODcsImV4cCI6MjA4MDQ2MTE4N30.EuTd_i9fEecFGJG89PhRa3z68k5x6nflOW6fvqvMQJM'
      );
    } catch (error) {
      console.error('فشل في تهيئة قاعدة البيانات:', error);
      showError('خطأ في تحميل قاعدة البيانات. يرجى تحديث الصفحة.');
    }

    let allData = [];
    let userRole = '';
    let userBranches = [];
    let filteredData = [];
    let selectedCommittees = [];
    let columnFilters = {
      nationalId: '',
      clientId: '',
      clientName: '',
      project: '',
      guarantorId: '',
      guarantorName: ''
    };
    let searchTimeout = null;

    function showError(message) {
      document.getElementById('tableContainer').innerHTML = `<div class="error">${message}</div>`;
    }

    function showLoading(message) {
      document.getElementById('loadingMessage').textContent = message;
    }

    async function init() {
      if (!validateSession()) {
        return;
      }

      const userId = localStorage.getItem('loggedInUserId');
      
      try {
        showLoading('جاري تحميل معلومات المستخدم...');
        
        userRole = localStorage.getItem('userRole') || '';
        const branchesStr = localStorage.getItem('userBranches') || '[]';
        userBranches = JSON.parse(branchesStr);
        
        if (!userRole) {
          const { data: user, error } = await db
            .from('users')
            .select('role, branches')
            .eq('id', userId)
            .single();

          if (error) throw error;
          
          userRole = user.role;
          userBranches = user.branches || [];
          
          localStorage.setItem('userRole', userRole);
          localStorage.setItem('userBranches', JSON.stringify(userBranches));
        }

        showLoading('جاري تحميل البيانات...');
        await loadOldCommitteesNidSet();
        await loadKycReportsMap();
        await loadData();
        
        document.addEventListener('click', function(e) {
          if (!e.target.closest('.committee-filter')) {
            document.getElementById('committeeDropdown').classList.remove('show');
          }
        });

      } catch (err) {
        console.error('خطأ في التطبيق:', err);
        showError(`خطأ: ${err.message || 'فشل في تحميل البيانات'}`);
      }
    }

    async function loadData() {
      try {
        let query = db.from('operations_with_details').select('*');
        
        if (userRole !== 'admin' && userRole !== 'followup_supervisor' && userBranches && userBranches.length > 0) {
          query = query.in('الفرع', userBranches);
        }
        
        const { data, error } = await query.order('created_at', { ascending: false });

        if (error) {
          console.error('خطأ في جلب البيانات:', error);
          throw new Error('فشل في جلب البيانات من قاعدة البيانات');
        }

        allData = data || [];
        filteredData = [...allData];
        renderFilters();
        renderTable(filteredData);
        updateStats(filteredData);
        renderNotifBanner();
        
        // تفعيل زر التصدير بعد تحميل البيانات
        document.getElementById('exportBtn').disabled = false;

      } catch (err) {
        console.error('خطأ في loadData:', err);
        throw err;
      }
    }

    function renderFilters() {
      try {
        let branches = [];
        if (userRole === 'admin' || userRole === 'followup_supervisor') {
          branches = [...new Set(allData.map(row => row["الفرع"]).filter(v => v && v.trim()))];
        } else if (userBranches && userBranches.length > 0) {
          branches = userBranches;
        }

        const branchSelect = document.getElementById('filterBranch');
        branchSelect.innerHTML = '<option value="">الكل</option>';
        branches.forEach(v => {
          const opt = document.createElement('option');
          opt.value = v;
          opt.textContent = v;
          branchSelect.appendChild(opt);
        });

        const reviews = [...new Set(allData.map(row => row["المراجعة الداخلية"]).filter(v => v && v.trim()))];
        const supervisors = [...new Set(allData.map(row => row["مسؤول المتابعة"]).filter(v => v && v.trim()))];
        const admins = [...new Set(allData.map(row => row["الادارة"]).filter(v => v && v.trim()))];
        const officers = [...new Set(allData.map(row => row["اسم الاخصائى"]).filter(v => v && v.trim()))];
        const committees = [...new Set(allData.map(row => row["رقم اللجنة"]).filter(v => v && v.trim()))].sort();

        const selects = [
          { id: 'filterReview', data: reviews },
          { id: 'filterSupervisor', data: supervisors },
          { id: 'filterAdmin', data: admins },
          { id: 'filterOfficer', data: officers }
        ];

        selects.forEach(item => {
          const select = document.getElementById(item.id);
          select.innerHTML = '<option value="">الكل</option>';
          item.data.forEach(v => {
            const opt = document.createElement('option');
            opt.value = v;
            opt.textContent = v;
            select.appendChild(opt);
          });
        });

        const dropdown = document.getElementById('committeeDropdown');
        dropdown.innerHTML = `
          <div class="committee-buttons">
            <button class="committee-btn select-all" onclick="selectAllCommittees()">اختيار كل اللجان</button>
            <button class="committee-btn select-committees" onclick="selectCommitteesWithWord()">اللجان التي تحتوي على "لجنة" أو "لجنه"</button>
            <button class="committee-btn clear" onclick="clearAllCommittees()">إلغاء الكل</button>
          </div>
          <div id="committeeItemsContainer"></div>
        `;
        
        const itemsContainer = document.getElementById('committeeItemsContainer');
        committees.forEach(committee => {
          const div = document.createElement('div');
          div.className = 'committee-item';
          div.innerHTML = `
            <input type="checkbox" id="comm_${committee}" value="${committee}" onchange="updateSelectedCommittees()">
            <label for="comm_${committee}">${committee}</label>
          `;
          itemsContainer.appendChild(div);
        });

        ['filterBranch', 'filterReview', 'filterSupervisor', 'filterAdmin', 'filterOfficer', 'filterTransferred'].forEach(id => {
          const element = document.getElementById(id);
          if (element) {
            element.addEventListener('change', applyAllFilters);
          }
        });

      } catch (err) {
        console.error('خطأ في renderFilters:', err);
      }
    }

    function toggleCommitteeDropdown() {
      const dropdown = document.getElementById('committeeDropdown');
      dropdown.classList.toggle('show');
    }

    function selectAllCommittees() {
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      checkboxes.forEach(cb => {
        cb.checked = true;
      });
      updateSelectedCommittees();
    }

    function selectCommitteesWithWord() {
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      checkboxes.forEach(cb => {
        const committeeName = cb.value || '';
        const normalizedName = committeeName.toLowerCase().trim();
        if (normalizedName.includes('لجنة') || normalizedName.includes('لجنه')) {
          cb.checked = true;
        } else {
          cb.checked = false;
        }
      });
      updateSelectedCommittees();
    }

    function clearAllCommittees() {
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      checkboxes.forEach(cb => {
        cb.checked = false;
      });
      updateSelectedCommittees();
    }

    function updateSelectedCommittees() {
      const checkboxes = document.querySelectorAll('#committeeDropdown input[type="checkbox"]');
      selectedCommittees = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
      
      const text = document.getElementById('selectedCommitteesText');
      if (selectedCommittees.length > 0) {
        text.textContent = `تم اختيار ${selectedCommittees.length} لجنة`;
        
        const shortList = selectedCommittees.slice(0, 3).join('، ');
        if (selectedCommittees.length > 3) {
          text.textContent += `: ${shortList} +${selectedCommittees.length - 3} أخرى`;
        } else {
          text.textContent += `: ${shortList}`;
        }
      } else {
        text.textContent = '';
      }
      
      applyAllFilters();
    }

    function applyAllFilters() {
      try {
        const branch = document.getElementById('filterBranch').value;
        const review = document.getElementById('filterReview').value;
        const supervisor = document.getElementById('filterSupervisor').value;
        const admin = document.getElementById('filterAdmin').value;
        const officer = document.getElementById('filterOfficer').value;
        const transferred = document.getElementById('filterTransferred').value;

        filteredData = allData.filter(row => {
          if (branch && row["الفرع"] !== branch) return false;
          if (review && row["المراجعة الداخلية"] !== review) return false;
          if (supervisor && row["مسؤول المتابعة"] !== supervisor) return false;
          if (admin && row["الادارة"] !== admin) return false;
          if (officer && row["اسم الاخصائى"] !== officer) return false;
          if (transferred !== '') {
            const isTransferred = row["تم التحويل"] === true;
            if (transferred === 'true' && !isTransferred) return false;
            if (transferred === 'false' && isTransferred) return false;
          }
          
          if (selectedCommittees.length > 0) {
            if (!selectedCommittees.includes(row["رقم اللجنة"])) return false;
          }

          if (columnFilters.nationalId && !row["رقم البطاقة العميل"]?.toLowerCase().includes(columnFilters.nationalId)) return false;
          if (columnFilters.clientId && !row["كود_العميل"]?.toLowerCase().includes(columnFilters.clientId)) return false;
          if (columnFilters.clientName) {
            const name1 = row["اسم_العميل"]?.toLowerCase() || '';
            const name2 = row["اسم_العميل_من_بيانات_القروض"]?.toLowerCase() || '';
            const name3 = row["اسم_العميل_من_التقييم"]?.toLowerCase() || '';
            if (!name1.includes(columnFilters.clientName) && 
                !name2.includes(columnFilters.clientName) && 
                !name3.includes(columnFilters.clientName)) return false;
          }
          if (columnFilters.project && !row["المشروع"]?.toLowerCase().includes(columnFilters.project)) return false;
          if (columnFilters.guarantorId && !row["رقم بطاقة الضامن"]?.toLowerCase().includes(columnFilters.guarantorId)) return false;
          if (columnFilters.guarantorName && !row["اسم_الضامن"]?.toLowerCase().includes(columnFilters.guarantorName)) return false;

          return true;
        });

        renderTable(filteredData);
        updateStats(filteredData);
      } catch (err) {
        console.error('خطأ في applyAllFilters:', err);
      }
    }

    function updateColumnFilter(field, value) {
      columnFilters[field] = value.toLowerCase();
      
      if (searchTimeout) {
        clearTimeout(searchTimeout);
      }
      
      searchTimeout = setTimeout(() => {
        applyAllFilters();
      }, 1000);
    }
    
    function searchOnEnter(event, field, value) {
      if (event.key === 'Enter') {
        if (searchTimeout) {
          clearTimeout(searchTimeout);
        }
        columnFilters[field] = value.toLowerCase();
        applyAllFilters();
      }
    }

    function resetFilters() {
      document.getElementById('filterBranch').value = '';
      document.getElementById('filterReview').value = '';
      document.getElementById('filterSupervisor').value = '';
      document.getElementById('filterAdmin').value = '';
      document.getElementById('filterOfficer').value = '';
      document.getElementById('filterTransferred').value = '';
      
      clearAllCommittees();
      
      columnFilters = {
        nationalId: '',
        clientId: '',
        clientName: '',
        project: '',
        guarantorId: '',
        guarantorName: ''
      };
      
      filteredData = [...allData];
      renderTable(filteredData);
      updateStats(filteredData);
    }

    function updateStats(data) {
      document.getElementById('totalRecords').textContent = data.length.toLocaleString('ar-EG');
      
      const totalAmount = data.reduce((sum, row) => {
        const amount = parseFloat(row["المبلغ المطلوب"]) || 0;
        return sum + amount;
      }, 0);
      
      const totalTransferred = data.reduce((sum, row) => {
        const amount = parseFloat(row["المبلغ_البنكي"]) || 0;
        return sum + amount;
      }, 0);
      
      const totalFinance = data.reduce((sum, row) => {
        const amount = parseFloat(row["قيمة_القرض_البنكي"]) || 0;
        return sum + amount;
      }, 0);
      
      const totalAdminFees = data.reduce((sum, row) => {
        const amount = parseFloat(row["المصاريف_الادارية_البنكية"]) || 0;
        return sum + amount;
      }, 0);
      
      document.getElementById('totalAmount').textContent = totalAmount.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('totalTransferred').textContent = totalTransferred.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('totalFinance').textContent = totalFinance.toLocaleString('ar-EG') + ' ج.م';
      document.getElementById('totalAdminFees').textContent = totalAdminFees.toLocaleString('ar-EG') + ' ج.م';
    }

    function renderNotifBanner() {
      const banner = document.getElementById('notifBanner');
      if (!banner) return;

      const pendingReview = allData.filter(row => row["المراجعة الداخلية"] === 'لم تتم المراجعة').length;
      const pendingSupervise = allData.filter(row => {
        const s = row["مسؤول المتابعة"];
        return !s || s.trim() === '' || s === 'لم تتم المراجعة';
      }).length;
      const pendingAdmin = allData.filter(row => {

        return !s || s.trim() === '' || s === 'لم تتم المراجعة';
      }).length;

      const total = pendingReview + pendingSupervise + pendingAdmin;

    function renderDetailItems(row, items, showContainer = true) {
      let html = showContainer ? '' : '';
      items.forEach(item => {
        const [label, key, isDate = false, color = '', fontSize = '', isBoolean = false] = item;
        let value = row[key] || '—';
        
        if (isDate && value !== '—') {
          value = new Date(value).toLocaleDateString('ar-EG');
        } else if (isBoolean) {
          value = value === true || value === 'true' ? 
            '<span style="color: #2ecc71;">✓ نعم</span>' : 
            '<span style="color: #e74c3c;">✗ لا</span>';
        }
        
        const style = color ? `style="color: ${color}; font-weight: bold;"` : '';
        const fontStyle = fontSize ? `style="font-size: ${fontSize};"` : '';
        
        html += `
          <div class="detail-item">
            <span class="detail-label" ${style}>${label}:</span>
            <span class="detail-value" ${fontStyle}>${value}</span>
          </div>
        `;
      });
      return html;
    }

    function toggleDetail(index, event) {
      const detailRow = document.getElementById(`detail-${index}`);
      const btn = event.target;
      if (detailRow.style.display === 'none' || !detailRow.style.display) {
        detailRow.style.display = 'table-row';
        btn.textContent = 'إخفاء';
        btn.style.background = 'linear-gradient(135deg, #e74c3c 0%, #c0392b 100%)';
      } else {
        detailRow.style.display = 'none';
        btn.textContent = 'تفاصيل';
        btn.style.background = 'linear-gradient(135deg, #1c3f66 0%, #0f2846 100%)';
      }
    }

    // ========== تحميل قائمة أرقام بطاقات العملاء الذين لديهم لجان قديمة (لتفعيل/تعطيل الزر) ==========
    async function loadOldCommitteesNidSet() {
      window.oldCommitteesNids = new Set();
      try {
        let page = 0;
        const pageSize = 1000;
        while (true) {
          const { data, error } = await db
            .from('اللجان_القديمة')
            .select('"رقم بطاقة العميل"')
            .range(page * pageSize, (page + 1) * pageSize - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          data.forEach(r => { if (r["رقم بطاقة العميل"]) window.oldCommitteesNids.add(r["رقم بطاقة العميل"]); });
          if (data.length < pageSize) break;
          page++;
        }
      } catch (e) {
        console.error('تعذر تحميل قائمة اللجان القديمة:', e);
      }
    }

    // ========== فتح السجل التاريخي (اللجان القديمة) للعميل ==========
    function openClientHistory(idx) {
      const row = (window.currentTableData || [])[idx];
      if (!row) {
        alert('تعذر العثور على بيانات هذا السجل.');
        return;
      }
      const nid = row["رقم البطاقة العميل"];
      if (!nid) {
        alert('لا يوجد رقم بطاقة لهذا العميل.');
        return;
      }
      window.open('client-history.html?nid=' + encodeURIComponent(nid), '_blank');
    }

    // ========== تحميل خريطة (operation_id -> kyc report id) لمعرفة مين اتعمله تقرير اعرف عميلك بالفعل ==========
    async function loadKycReportsMap() {
      window.kycReportsByOperation = new Map();
      try {
        let page = 0;
        const pageSize = 1000;
        while (true) {
          const { data, error } = await db
            .from('kyc_reports')
            .select('id, operation_id')
            .not('operation_id', 'is', null)
            .range(page * pageSize, (page + 1) * pageSize - 1);
          if (error) throw error;
          if (!data || data.length === 0) break;
          data.forEach(r => {
            if (r.operation_id && !window.kycReportsByOperation.has(r.operation_id)) {
              window.kycReportsByOperation.set(r.operation_id, r.id);
            }
          });
          if (data.length < pageSize) break;
          page++;
        }
      } catch (e) {
        console.error('تعذر تحميل سجل تقارير اعرف عميلك:', e);
      }
    }

    // ========== إنشاء تقرير اعرف عميلك (KYC) معبأ مسبقًا ==========
    async function openKYCReport(idx, btnEl) {
      const row = (window.currentTableData || [])[idx];
      if (!row) {
        alert('تعذر العثور على بيانات هذا السجل.');
        return;
      }

      if (btnEl && btnEl.disabled) return;
      const originalText = btnEl ? btnEl.textContent : '';
      if (btnEl) {
        btnEl.disabled = true;
        btnEl.style.opacity = '0.6';
        btnEl.textContent = '⏳ جارٍ التحقق...';
      }

      try {
        // ✅ فحص من قاعدة البيانات مباشرة قبل الإنشاء - يمنع تكرار السجل نهائيًا
        let existingId = window.kycReportsByOperation && window.kycReportsByOperation.get(row.id);

        if (!existingId) {
          const { data: existing, error: checkError } = await db
            .from('kyc_reports')
            .select('id')
            .eq('operation_id', row.id)
            .limit(1);

          if (checkError) throw checkError;

          if (existing && existing.length > 0) {
            existingId = existing[0].id;
            if (window.kycReportsByOperation) window.kycReportsByOperation.set(row.id, existingId);
          }
        }

        if (existingId) {
          window.open('kyc-report.html?id=' + existingId, '_blank');
          return;
        }

        // مفيش تقرير قبل كده - نعمل واحد جديد ومعبّى بأكبر قدر من البيانات المتاحة فعليًا
        const newRecord = {
          operation_id: row.id || null,
          code: row["كود_العميل"] || null,
          name: row["اسم_العميل"] || row["اسم_العميل_من_بيانات_القروض"] || row["اسم_العميل_من_التقييم"] || null,
          national_id: row["رقم البطاقة العميل"] || null,
          area: row["المنطقه"] || row["الفرع"] || null,
          activity: row["المشروع"] || row["النشاط_الثانى"] || null,
          purpose: row["المشروع"] || null,
          loan: row["المبلغ المطلوب"] || null,
          gps: row["احداثيات الموقع"] || null,
          date: new Date().toISOString().slice(0, 10),
          notes: `تم استيراد البيانات الأساسية تلقائيًا من نظام إدارة التمويل بتاريخ ${new Date().toLocaleDateString('ar-EG')}`,
          created_by: localStorage.getItem('loggedInUser') || null
        };

        const { data: inserted, error: insertError } = await db
          .from('kyc_reports')
          .insert([newRecord])
          .select();

        if (insertError) throw insertError;

        const newId = inserted[0].id;
        if (window.kycReportsByOperation) window.kycReportsByOperation.set(row.id, newId);

        if (btnEl) {
          btnEl.textContent = '📂 اعرف عميلك (تم الإنشاء)';
          btnEl.setAttribute('title', 'تم إنشاء تقرير اعرف عميلك لهذا العميل من قبل');
        }

        window.open('kyc-report.html?id=' + newId, '_blank');

      } catch (e) {
        console.error('خطأ في فتح/إنشاء تقرير اعرف عميلك:', e);
        alert('❌ حدث خطأ: ' + (e.message || e));
        if (btnEl) btnEl.textContent = originalText;
      } finally {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.style.opacity = '1';
        }
      }
    }
